<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta
        name="viewport"

    <title>Pro Delivery - منظم الطرود</title>

    <link

    <link

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 8px;
            direction: rtl;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 19px;
            margin: 8px 0 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        .stat-box {
            background: #1e293b;
            padding: 7px;
            border-radius: 7px;
            border: 1px solid #334155;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-box span {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 3px;
        }

        .card {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #334155;
        }

        .action-main-btn {
            display: block;
            width: 100%;
            background: #0284c7;
            color: white;
            text-align: center;
            padding: 11px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 6px;
            border: none;
        }

        .action-main-btn:active {
            transform: scale(.98);
        }

        .ai-btn {
            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );
        }

        .paste-btn {
            background: #059669;
        }

        .voice-btn {
            background: #db2777;
        }

        .report-btn {
            background: #4f46e5;
        }

        .reset-btn {
            background: #334155;
            color: #ef4444;
            border: 1px solid #475569;
        }

        .loading {
            text-align: center;
            color: #fbbf24;
            font-weight: bold;
            margin-top: 8px;
            font-size: 13px;
            display: none;
        }

        .connection {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin: 5px 0;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #334155;
            border: 1px solid #475569;
            padding: 9px;
            border-radius: 7px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .parcel-info {
            font-size: 12px;
            color: #f1f5f9;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }

        .address-box {
            font-size: 13px;
            color: #cbd5e1;
            background: #0f172a;
            padding: 7px;
            border-radius: 5px;
            line-height: 1.6;
        }

        .parcel-fields {
            background: #1e293b;
            border-radius: 5px;
            padding: 6px;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 7px 2px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            color: white;
            min-width: 60px;
        }

        .map-btn {
            background: #2563eb;
        }

        .sms-btn {
            background: #d97706;
        }

        .wa-btn {
            background: #16a34a;
        }

        .absent-btn {
            background: #dc2626;
        }

        .deliver-btn {
            background: #15803d;
        }

        .proof-btn {
            background: #7c3aed;
        }

        .edit-btn {
            background: #475569;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #475569;
            color: #fff;
            white-space: nowrap;
        }

        .status-delivered {
            background: #15803d;
        }

        .status-reattempt {

        }

            margin-top: 3px;
            border: 1px solid #64748b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin: 10px 0;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,.75);
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.show {

        }

        .modal-content {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 430px;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid #475569;
        }

        .modal-content h3 {
            color: #38bdf8;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {

            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .form-input {
            width: 100%;

            border-radius: 6px;
            border: 1px solid #475569;

        .form-input:focus {
            border-color: #38bdf8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .modal-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .modal-btn {

            border: none;
            padding: 9px;
            border-radius: 6px;

        .close-btn {

            color: #e2e8f0;

            text-align: right;
            white-space: pre-line;

        /* AI Preview */

            background: #0f172a;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 11px;

        }

        .next-stop {

            border: 1px solid #2563eb;
            border-radius: 7px;

            font-size: 12px;

            margin-bottom: 8px;

        }

    </style>
</head>


<body>

    <h1>📦 Pro Delivery</h1>


    <!-- الإحصائيات -->

            الإجمالي

        </div>

        >

        </div>

        <div

            style="color:#facc15;"
        >
            المتبقي
            <span
                id="remainingCount"
                style="color:#facc15;"
            >
                0
            </span>
        </div>

        <div

            style="color:#f87171;"
        >
            غياب
            <span
                id="absentCount"
                style="color:#f87171;"
            >
                0
            </span>
        </div>

        <div
            class="stat-box"
            style="color:#38bdf8; grid-column:span 2;"
        >
            المسافة
            <span
                id="distanceKm"
                style="color:#38bdf8;"
            >
                0.00 كم

    </div>


    <!-- التحكم -->

    <div class="card">

        <!-- AI Camera -->

            id="aiScanBtn"
            class="action-main-btn ai-btn"
        >
            🤖 📷 قراءة العنوان بالـAI
        </button>

            accept="image/*"
            capture="environment"

        >


        <!-- OCR محلي احتياطي -->

            type="file"

            accept="image/*"
            capture="environment"
            hidden
            onchange="processImage(event)"
        >

        <button
            class="action-main-btn"
            onclick="document.getElementById('parcelImage').click()"
        >
            📄 OCR محلي
        </button>


        <!-- Barcode -->

        <button

            class="action-main-btn"

        >
            🔳 مسح Barcode / QR
        </button>


        <!-- Clipboard -->

        <button
            class="action-main-btn paste-btn"
            onclick="pasteFromClipboard()"
        >
            📋 لصق العنوان
        </button>


        <!-- Voice -->

        <button
            class="action-main-btn voice-btn"
            onclick="startVoiceInput()"
        >
            🎤 إدخال عنوان صوتي
        </button>


        <!-- Optimize -->

        <button
            class="action-main-btn"
            style="background:#0ea5e9;"
            onclick="optimizeRoute()"
        >
            🗺️ أقرب طرد
        </button>


        <!-- Report -->

        <button
            class="action-main-btn report-btn"
            onclick="generateReport()"
        >
            📊 تقرير نهاية اليوم
        </button>


        <div
            id="loading"
            class="loading"
        >
            ⏳ جاري قراءة البيانات...
        </div>


        <div
            id="connectionStatus"
            class="connection"
        >
            🟢 التطبيق جاهز
        </div>

    </div>


    <!-- التالي -->

    <div
        id="nextStop"
        class="next-stop"
    ></div>


    <!-- الطرود -->

    <div
        class="card"
        style="padding:8px;"
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:6px;
            "
        >

            <h3
                style="
                    margin:0;
                    font-size:13px;
                "
            >
                الطرود بالشنطة:
            </h3>

            <button

                style="flex:none;"
                onclick="clearAllData()"
            >
                إعادة ضبط
            </button>

        </div>


        <ul id="parcelsList">

            <p

                ما في طرود مضافة. ابدأ الإدخال!

    <!-- Modal إضافة/تعديل طرد -->

    <!-- Report -->

                📊 تقرير إنجاز اليوم

            <div
                id="reportBox"
                class="report-text"
            ></div>

            <div class="modal-actions">

                <button
                    class="modal-btn"
                    onclick="copyReport()"

                    📋 نسخ

                    onclick="closeReportModal()"

                    إغلاق
                </button>

            </div>

        </div>

    </div>


<script>

/* =====================================================
   DATABASE / DATA
===================================================== */

let parcels =
    JSON.parse(
        localStorage.getItem(
            "saved_parcels"
        )
    ) || [];

let totalDistance =
    parseFloat(
        localStorage.getItem(
            "saved_distance"
        )
    ) || 0;

let lastLat =
    parseFloat(
        localStorage.getItem(
            "last_lat"
        )
    ) || null;

let lastLon =
    parseFloat(
        localStorage.getItem(
            "last_lon"
        )
    ) || null;


/* =====================================================
   INITIALIZE
===================================================== */

updateUI();
initTracker();
initAI();


/* =====================================================
   AI CAMERA
===================================================== */

const AI_BACKEND_URL =
    "https://pro-delivery-ai.yasserkhalil.workers.dev";


function initAI() {

    const button =
        document.getElementById(
            "aiScanBtn"
        );

    const input =
        document.getElementById(
            "aiCameraInput"
        );

    if (!button || !input)
        return;


    button.addEventListener(
        "click",
        () => {

            input.click();

        }
    );


    input.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files?.[0];

            event.target.value = "";

            if (!file)
                return;


            showLoading(true);

            button.disabled = true;

            button.innerText =
                "🤖 جاري تحليل الورقة...";


            try {

                const image =
                    await fileToDataURL(
                        file
                    );


                const result =
                    await analyzeAddressWithAI(
                        image
                    );


                openParcelForm(
                    result
                );


            } catch(error) {

                console.error(error);

                alert(
                    "تعذر تحليل الصورة:\n\n" +
                    error.message
                );

            } finally {

                showLoading(false);

                button.disabled =
                    false;

                button.innerText =
                    "🤖 📷 قراءة العنوان بالـAI";
            }

        }
    );
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function analyzeAddressWithAI(image) {
    if (!AI_BACKEND_URL || AI_BACKEND_URL.includes("ضع_هنا")) {
        throw new Error("رابط الـBackend غير مضبوط.");
    }

    let mimeType = "image/jpeg";
    if (typeof image === "string" && image.startsWith("data:")) {
        const match = image.match(/^data:([^;]+);base64,/i);
        if (match && match[1]) mimeType = match[1].toLowerCase();
    }

    const supported = [
        "image/jpeg", "image/jpg", "image/png", "image/webp",
        "image/heic", "image/heif", "image/gif", "image/avif"
    ];
    if (!supported.includes(mimeType)) mimeType = "image/jpeg";

    const response = await fetch(AI_BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image, mimeType })
    });

    let data = null;
    try { data = await response.json(); }
    catch { throw new Error("استجابة غير صالحة من الـAI."); }

    if (!response.ok || !data.success) {
        let message = data.error || "فشل تحليل الصورة.";
        if (data.httpStatus) message += "\n\nHTTP: " + data.httpStatus;
        if (data.details) message += "\n\nتفاصيل:\n" + JSON.stringify(data.details, null, 2);
        throw new Error(message);
    }

    const ai = data.data || {};
    return {
        name: ai.recipientName || "",
        street: ai.street || "",
        house: ai.houseNumber || "",
        zip: ai.postalCode || "",
        city: ai.city || "",
        phone: ai.phone || "",
        barcode: ai.trackingNumber || "",
        raw_text: ai.address || "",
        confidence: Number(ai.confidence) || 0
    };
}

function showLoading(
    show
) {

    document.getElementById(
        "loading"
    ).style.display =
        show
            ? "block"
            : "none";
}


/* =====================================================
   REPORT
===================================================== */

function generateReport() {

    const total =
        parcels.length;


    const delivered =
        parcels.filter(
            p =>
                p.status ===
                "delivered"
        ).length;


    const absent =
        parcels.filter(
            p =>
                p.status ===
                "absent"
        ).length;


    const remaining =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        ).length;


    const success =
        total
            ? (
                delivered /
                total *
                100
            ).toFixed(1)
            : "0";


    const today =
        new Date()
            .toLocaleDateString(
                "ar-EG"
            );


    const report = `

📦 تقرير تسليم الطرود
${today}

--------------------------------

🔹 إجمالي الطرود:
${total}

✅ تم التسليم:
${delivered}

❌ غياب:
${absent}

⏳ المتبقي:
${remaining}

📈 نسبة النجاح:
${success}%

🚶‍♂️ المسافة:
${totalDistance.toFixed(2)} كم

--------------------------------

تم إنشاء التقرير بواسطة Pro Delivery.

`.trim();


    document.getElementById(
        "reportBox"
    ).innerText =
        report;


    document.getElementById(
        "reportModal"
    ).classList.add(
        "show"
    );
}


function copyReport() {

    const text =
        document.getElementById(
            "reportBox"
        ).innerText;


    navigator.clipboard
        .writeText(text)
        .then(
            () =>
                alert(
                    "تم نسخ التقرير."
                )
        );
}


function closeReportModal() {

    document.getElementById(
        "reportModal"
    ).classList.remove(
        "show"
    );
}


/* =====================================================
   CLOSE MODALS BY OUTSIDE CLICK
===================================================== */

window.addEventListener(
    "click",
    event => {

        if (
            event.target.id ===
            "parcelModal"
        ) {

            closeParcelModal();
        }


        if (
            event.target.id ===
            "reportModal"
        ) {

            closeReportModal();
        }

    }
);


/* =====================================================
   ONLINE / OFFLINE
===================================================== */

function updateConnection() {

    document.getElementById(
        "connectionStatus"
    ).innerText =
        navigator.onLine
            ? "🟢 متصل بالإنترنت"
            : "🟠 بدون إنترنت — الوضع المحلي يعمل";
}


window.addEventListener(
    "online",
    updateConnection
);

window.addEventListener(
    "offline",
    updateConnection
);

updateConnection();

</script>

</body>
</html>
