<script>

/* =====================================================
   DATABASE / DATA
===================================================== */

let parcels =
    JSON.parse(
        localStorage.getItem(
            "saved_parcels"
        )
    ) || [];

let totalDistance =
    parseFloat(
        localStorage.getItem(
            "saved_distance"
        )
    ) || 0;

let lastLat =
    parseFloat(
        localStorage.getItem(
            "last_lat"
        )
    ) || null;

let lastLon =
    parseFloat(
        localStorage.getItem(
            "last_lon"
        )
    ) || null;


/* =====================================================
   INITIALIZE
===================================================== */

updateUI();
initTracker();
initAI();


/* =====================================================
   AI CAMERA
===================================================== */

const AI_BACKEND_URL =
    "https://pro-delivery-ai.yasserkhalil.workers.dev";

const GEOCODE_BACKEND_URL =
    AI_BACKEND_URL + "/geocode";

let activeParcelSection = "route";

function parcelCreatedDate(parcel) {
    return parcel.createdAt || parcel.addedAt || parcel.created_at || null;
}

function isTodayParcel(parcel) {
    const raw = parcelCreatedDate(parcel);
    if (!raw) return false;
    const d = new Date(raw);
    if (Number.isNaN(d.getTime())) return false;
    const now = new Date();
    return (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate()
    );
}

function ensureParcelDates() {
    let changed = false;
    parcels.forEach(p => {
        if (!parcelCreatedDate(p)) {
            p.createdAt = new Date().toISOString();
            changed = true;
        }
    });
    if (changed) {
        localStorage.setItem("saved_parcels", JSON.stringify(parcels));
    }
}

function normalizePhone(phone) {
    let p = String(phone || "").trim();
    if (!p) return "";
    p = p.replace(/[^\d+]/g, "");
    if (p.startsWith("00")) p = "+" + p.slice(2);
    if (p.startsWith("0") && !p.startsWith("00")) {
        p = "+49" + p.slice(1);
    }
    return p;
}

function formatDateTime(value) {
    if (!value) return "غير مسجل";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value);
    return d.toLocaleString("de-DE", {
        dateStyle: "short",
        timeStyle: "short"
    });
}

function openWhatsApp(parcel, delivered = false) {
    const phone = normalizePhone(parcel.phone);
    if (!phone) {
        alert("لا يوجد رقم هاتف لهذا الطرد.");
        return;
    }

    const text = delivered
        ? "Hallo, Ihr Paket wurde erfolgreich zugestellt. Vielen Dank!"
        : "Hallo, ich bin gerade in Ihrer Straße und habe Ihr Paket dabei.";

    window.open(
        "https://wa.me/" +
        phone.replace(/\D/g, "") +
        "?text=" +
        encodeURIComponent(text),
        "_blank"
    );
}

function openNavigation(parcel) {
    const address = getAddress(parcel);
    const query =
        Number.isFinite(Number(parcel.lat)) &&
        Number.isFinite(Number(parcel.lon))
            ? `${parcel.lat},${parcel.lon}`
            : address;

    window.open(
        "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(query),
        "_blank"
    );
}

function sendDeliveryWhatsApp(parcel) {
    openWhatsApp(parcel, true);
}

function showParcelSection(section) {
    activeParcelSection = section;

    ["route", "today", "all", "history"].forEach(name => {
        const el = document.getElementById("section" + name.charAt(0).toUpperCase() + name.slice(1));
        if (el) el.style.display = name === section ? "block" : "none";

        const btn = document.getElementById("menu" + name.charAt(0).toUpperCase() + name.slice(1) + "Btn");
        if (btn) btn.classList.toggle("active", name === section);
    });

    renderAdvancedLists();
}

function renderAdvancedLists() {
    const active = parcels.filter(p => p.status !== "delivered");
    const today = parcels.filter(isTodayParcel);
    const history = parcels.filter(p => p.status === "delivered");

    document.getElementById("todayCount").textContent = today.length;
    document.getElementById("allCount").textContent = parcels.length;
    document.getElementById("historyCount").textContent = history.length;

    const route = [...active]
        .filter(p => Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lon)))
        .sort((a,b) => (Number(a.routeOrder || 999999) - Number(b.routeOrder || 999999)));

    renderAdvancedList("routeList", route, true);
    renderAdvancedList("todayList", today, false);
    renderAdvancedList("allList", parcels, false);
    renderAdvancedList("historyList", history, false);
}

function renderAdvancedList(containerId, list, routeMode) {
    const box = document.getElementById(containerId);
    if (!box) return;

    if (!list.length) {

function openSignaturePad(index) {
    let modal = document.getElementById("signatureModal");

    if (!modal) {
        modal = document.createElement("div");
        modal.id = "signatureModal";
        modal.className = "modal";
        modal.innerHTML = `
            <div class="modal-content">
                <h3>✍️ توقيع المستلم</h3>
                <canvas id="signatureCanvas" class="signature-pad" width="800" height="320"></canvas>
                <div class="modal-actions">
                    <button class="modal-btn" onclick="saveSignature(${index})">✅ حفظ التوقيع</button>
                    <button class="modal-btn close-btn" onclick="clearSignaturePad()">🗑️ مسح</button>
                </div>
                <button class="modal-btn close-btn" style="width:100%;margin-top:6px;" onclick="closeSignaturePad()">إغلاق</button>
            </div>
        `;
        document.body.appendChild(modal);

        const canvas = document.getElementById("signatureCanvas");
        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#111827";

        let drawing = false;

        function point(e) {
            const rect = canvas.getBoundingClientRect();
            const source = e.touches ? e.touches[0] : e;
            return {
                x: (source.clientX - rect.left) * canvas.width / rect.width,
                y: (source.clientY - rect.top) * canvas.height / rect.height
            };
        }

        const start = e => {
            drawing = true;
            const p = point(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            e.preventDefault();
        };

        const move = e => {
            if (!drawing) return;
            const p = point(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            e.preventDefault();
        };

        const stop = () => drawing = false;

        canvas.addEventListener("mousedown", start);
        canvas.addEventListener("mousemove", move);
        canvas.addEventListener("mouseup", stop);
        canvas.addEventListener("mouseleave", stop);

        canvas.addEventListener("touchstart", start, {passive:false});
        canvas.addEventListener("touchmove", move, {passive:false});
        canvas.addEventListener("touchend", stop);
    }

    modal.dataset.index = String(index);
    modal.classList.add("show");
}

function clearSignaturePad() {
    const canvas = document.getElementById("signatureCanvas");
    if (!canvas) return;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
}

function saveSignature(index) {
    const canvas = document.getElementById("signatureCanvas");
    if (!canvas) return;

    const data = canvas.toDataURL("image/png");

    // Save only when the canvas actually contains something.
    const pixels = canvas.getContext("2d")
        .getImageData(0, 0, canvas.width, canvas.height).data;

    let hasInk = false;
    for (let i = 3; i < pixels.length; i += 4) {
        if (pixels[i] > 0) {
            hasInk = true;
            break;
        }
    }

    if (!hasInk) {
        alert("يرجى توقيع المستلم أولًا.");
        return;
    }

    parcels[index].signatureUrl = data;
    parcels[index].signatureAt = new Date().toISOString();

    saveAndSync();
    closeSignaturePad();
}

function closeSignaturePad() {
    const modal = document.getElementById("signatureModal");
    if (modal) modal.classList.remove("show");
}



function initAI() {

    const button =
        document.getElementById(
            "aiScanBtn"
        );

        );

    if (!button || !input)
        return;


    button.addEventListener(

        }
    );


    input.addEventListener(
        "change",

            showLoading(true);

            button.disabled = true;

            button.innerText =

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function analyzeAddressWithAI(
    image
) {

    if (
        !AI_BACKEND_URL ||
        AI_BACKEND_URL.includes(
            "ضع_هنا"
        )
    ) {

        throw new Error(
            "ضع رابط الـBackend في AI_BACKEND_URL داخل index.html."
        );
    }


    const response =
        await fetch(
            AI_BACKEND_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: image
                })
            }
        );


    if (!response.ok) {

        let message =
            "فشل الاتصال بالـAI.";

        try {

            const data =
                await response.json();

            message =
                data.error ||
                message;

        } catch {}

        throw new Error(
            message
        );
    }


    const data =
        await response.json();


    if (!data.success) {

        throw new Error(
            data.error ||
            "فشل تحليل الصورة."
        );
    }


    return data.data || {};
}

function initTracker() {

    if (
        "geolocation"
        in navigator
    ) {

        navigator.geolocation.watchPosition(

            position => {

                const currentLat =
                    position.coords.latitude;

                const currentLon =
                    position.coords.longitude;


                if (
                    lastLat !== null &&
                    lastLon !== null
                ) {

                    const distance =
                        calculateDistance(
                            lastLat,
                            lastLon,
                            currentLat,
                            currentLon
                        );


                    if (
                        distance > 0.005 &&
                        distance < 2.0
                    ) {

                        totalDistance +=
                            distance;

                        localStorage.setItem(
                            "saved_distance",
                            totalDistance
                        );

                        updateUI();
                    }
                }


                lastLat =
                    currentLat;

                lastLon =
                    currentLon;


                localStorage.setItem(
                    "last_lat",
                    lastLat
                );

                localStorage.setItem(
                    "last_lon",
                    lastLon
                );

            },

            error => {

                console.log(
                    "GPS:",
                    error
                );

            },

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    5000,

                timeout:
                    15000
            }
        );
    }
}


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        deg2rad(
            lat2 - lat1
        );

    const dLon =
        deg2rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            deg2rad(lat1)
        ) *
        Math.cos(
            deg2rad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;
}


function deg2rad(deg) {

    return (
        deg *
        (Math.PI / 180)
    );
}

async function loadTesseractScript() {

    if (
        window.Tesseract
    ) {

        return window.Tesseract;
    }


    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

            script.onload =
                () =>
                    resolve(
                        window.Tesseract
                    );

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );
        }
    );
}


async function processImage(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    showLoading(true);


    try {

        const TesseractLib =
            await loadTesseractScript();


        const result =
            await TesseractLib.recognize(
                file,
                "eng+deu"
            );


        const text =
            result.data.text.trim();


        const parsed =
            parseAddressText(
                text
            );


        openParcelForm(
            parsed
        );


    } catch(error) {

        console.error(error);

        alert(
            "خطأ بقراءة الصورة."
        );

    } finally {

        showLoading(false);

        event.target.value = "";
    }
}


function parseAddressText(
    text
) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                x => x.trim()
            )
            .filter(
                x =>
                    x.length > 2
            );


    const zipMatch =
        text.match(
            /\b\d{5}\b/
        );


    const zip =
        zipMatch
            ? zipMatch[0]
            : "";


    let street = "";
    let house = "";


    for (
        const line
        of lines
    ) {

        const match =
            line.match(
                /^(.+?)\s+(\d+[a-zA-Z]?(?:-\d+[a-zA-Z]?)?)$/
            );


        if (match) {

            street =
                match[1].trim();

            house =
                match[2].trim();

            break;
        }
    }


    let city = "";


    if (zip) {

        const afterZip =
            text
                .slice(
                    text.indexOf(zip) + 5
                )
                .split(/\r?\n/)
                .map(
                    x =>
                        x.trim()
                )
                .filter(Boolean);


        city =
            afterZip[0] || "";
    }


    const phoneMatch =
        text.match(
            /(?:\+49|0049|0)\s?[\d\s()/.-]{8,}/
        );


    return {

        name:
            lines[1] ||
            lines[0] ||
            "",

        street,

        house,

        zip,

        city,

        phone:
            phoneMatch
                ? phoneMatch[0].trim()
                : "",

        barcode: "",

        raw_text:
            text
    };
}

   BARCODE / QR
===================================================== */

async function scanBarcode() {

    if (
        !("BarcodeDetector" in window)
    ) {

        alert(
            "BarcodeDetector غير مدعوم في هذا المتصفح. استخدم Chrome حديث."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video: {
                        facingMode:
                            "environment"
                    }
                });


        const video =
            document.createElement(
                "video"
            );


        video.style.position =
            "fixed";

        video.style.inset =
            "0";

        video.style.width =
            "100%";

        video.style.height =
            "100%";

        video.style.objectFit =
            "cover";

        video.style.zIndex =
            "9999";

        video.autoplay =
            true;

        video.playsInline =
            true;

        document.body.appendChild(
            video
        );


        video.srcObject =
            stream;


        const detector =
            new BarcodeDetector({
                formats: [
                    "qr_code",
                    "code_128",
                    "ean_13",
                    "ean_8",
                    "pdf417",
                    "data_matrix",
                    "aztec",
                    "upc_a",
                    "upc_e"
                ]
            });


        const scan =
            async () => {

                try {

                    const codes =
                        await detector.detect(
                            video
                        );


                    if (
                        codes.length
                    ) {

                        const value =
                            codes[0]
                                .rawValue;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        video.remove();


                        openParcelForm({
                            barcode:
                                value
                        });


                        return;
                    }

                } catch {}


                requestAnimationFrame(
                    scan
                );
            };


        scan();


    } catch(error) {

        alert(
            "تعذر فتح الكاميرا: " +
            error.message
        );
    }
}

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",
            "<":
                "&lt;",
            ">":
                "&gt;",
            '"':
                "&quot;",
            "'":
                "&#039;"
        }[char])
    );
}


function getAddress(
    parcel
) {

    const street =
        [
            parcel.street,
            parcel.house
        ]
            .filter(Boolean)
            .join(" ");


    const city =
        [
            parcel.zip,
            parcel.city
        ]
            .filter(Boolean)
            .join(" ");


    const address =
        [
            street,
            city
        ]
            .filter(Boolean)
            .join(", ");


    return (
        address ||
        parcel.address ||
        "عنوان غير مكتمل"
    );
}

    document.getElementById(
        "deliveredCount"
    ).innerText =
        delivered;


    document.getElementById(
        "remainingCount"
    ).innerText =
        remaining;


    document.getElementById(
        "absentCount"
    ).innerText =
        absent;


    document.getElementById(
        "distanceKm"
    ).innerText =
        totalDistance.toFixed(2) +
        " كم";


    listEl.innerHTML =
        "";


    if (!total) {

        listEl.appendChild(
            emptyMsg
        );

        emptyMsg.style.display =
            "block";

        return;
    }


    emptyMsg.style.display =
        "none";


    parcels.forEach(
        (parcel, index) => {

            const address =
                getAddress(
                    parcel
                );


            const mapsUrl =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(
                    address
                );


            const phone =
                parcel.phone ||
                "";


            const smsUrl =
                phone
                    ? `sms:${phone}?body=${encodeURIComponent(
                        "Hallo, Ihr Paket wurde erfolgreich zugestellt. Vielen Dank!"
                    )}`
                    : "#";


            const waUrl =
                phone
                    ? `https://wa.me/${phone.replace(
                        /\D/g,
                        ""
                    )}?text=${encodeURIComponent(
                        "Hallo, ich bin gerade in Ihrer Straße und habe Ihr Paket dabei."
                    )}`
                    : "#";


            let statusBadge =
                `<span class="status-badge">قيد الانتظار</span>`;


            if (
                parcel.status ===
                "delivered"
            ) {

                statusBadge =
                    `<span class="status-badge status-delivered">✓ تم</span>`;

            } else if (
                parcel.status ===
                "absent"
            ) {

                statusBadge =
                    `<span class="status-badge status-absent">✕ غياب</span>`;

            } else if (
                parcel.status ===
                "reattempt"
            ) {

                statusBadge =
                    `<span class="status-badge status-reattempt">🔄 إعادة</span>`;
            }


            const li =
                document.createElement(
                    "li"
                );


            li.innerHTML = `

                <div class="parcel-info">

                    <span>
                        📦 #${index + 1}
                        ${
                            parcel.barcode
                                ? " · " +
                                  escapeHTML(
                                      parcel.barcode
                                  )
                                : ""
                        }
                    </span>

                    ${statusBadge}

                </div>


                <div class="parcel-info">

                    <span>
                        ${escapeHTML(
                            parcel.name ||
                            "بدون اسم"
                        )}
                    </span>

                </div>


                <div class="address-box">

                    📍
                    ${escapeHTML(
                        address
                    )}

                </div>


                <div class="parcel-fields">

                    ${
                        parcel.phone
                            ? "📞 " +
                              escapeHTML(
                                  parcel.phone
                              )
                            : "📞 بدون هاتف"
                    }

                    ${
                        parcel.notes
                            ? "<br>📝 " +
                              escapeHTML(
                                  parcel.notes
                              )
                            : ""
                    }

                </div>


                <div class="btn-group">

                    <a
                        href="${mapsUrl}"
                        target="_blank"
                        class="action-btn map-btn"
                    >
                        🗺️ خريطة
                    </a>


                    ${
                        phone
                            ? `
                                <a
                                    href="${smsUrl}"
                                    class="action-btn sms-btn"
                                >
                                    💬 SMS
                                </a>
                            `
                            : ""
                    }


                    ${
                        phone
                            ? `
                                <a
                                    href="${waUrl}"
                                    target="_blank"
                                    class="action-btn wa-btn"
                                >
                                    🟢 واتساب
                                </a>
                            `
                            : ""
                    }


                    ${
                        parcel.status !==
                        "delivered"
                            ? `
                                <button
                                    class="action-btn deliver-btn"
                                    onclick="markDelivered(${index})"
                                >
                                    ✅ تسليم
                                </button>
                            `
                            : ""
                    }


                    ${
                        parcel.status !==
                        "absent"
                            ? `
                                <button
                                    class="action-btn absent-btn"
                                    onclick="markAbsent(${index})"
                                >
                                    🏠 غياب
                                </button>
                            `
                            : ""
                    }


                    <button
                        class="action-btn proof-btn"
                        onclick="takeProof(${index})"
                    >
                        📸 صورة
                    </button>


                    <button
                        class="action-btn edit-btn"
                        onclick="editParcel(${index})"
                    >
                        ✏️ تعديل
                    </button>

                </div>


                ${
                    parcel.proofUrl
                        ? `
                            <img
                                class="proof-img"
                                src="${parcel.proofUrl}"
                            >
                        `
                        : ""
                }

            `;


            listEl.appendChild(
                li
            );
        }
    );
}


/* =====================================================
   DELIVERED
===================================================== */

function markDelivered(index) {

    const parcel = parcels[index];

    parcel.status = "delivered";
    parcel.deliveredAt = new Date().toISOString();

    saveAndSync();

    if (parcel.phone) {
        const sendNow = confirm(
            "تم حفظ التسليم.\n\nهل تريد إرسال تأكيد التسليم عبر WhatsApp الآن؟"
        );

        if (sendNow) {
            sendDeliveryWhatsApp(parcel);
        }
    }

    showParcelSection("route");
}

/* =====================================================
   ABSENT
===================================================== */

function markAbsent(
    index
) {

    const parcel =
        parcels[index];


    parcel.status =
        "absent";


    parcel.attempts =
        (parcel.attempts || 0) +
        1;


    if (parcel.phone) {

        const text =
            encodeURIComponent(
                "Hallo, ich habe versucht, Ihr Paket zuzustellen, aber Sie waren nicht zu Hause."
            );


        window.location.href =
            `sms:${parcel.phone}?body=${text}`;
    }


    saveAndSync();
}

/* =====================================================
   PROOF OF DELIVERY
===================================================== */

function takeProof(
    index
) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";

    input.capture =
        "environment";


    input.onchange =
        event => {

            const file =
                event.target.files?.[0];


            if (!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    parcels[index]
                        .proofUrl =
                        event.target.result;


                    parcels[index]
                        .status =
                        "delivered";


                    parcels[index]
                        .deliveredAt =
                        new Date()
                            .toISOString();


                    saveAndSync();
                };


            reader.readAsDataURL(
                file
            );
        };


    input.click();
}


/* =====================================================
   ROUTE
===================================================== */

async function geocodeParcelForRoute(parcel) {

    const address = [
        parcel.street,
        parcel.house,
        parcel.zip,
        parcel.city,
        "Germany"
    ].filter(Boolean).join(", ");

    if (!address || address.length < 4) return false;

    if (
        Number.isFinite(Number(parcel.lat)) &&
        Number.isFinite(Number(parcel.lon))
    ) {
        return true;
    }

    let cache = {};
    try {
        cache = JSON.parse(
            localStorage.getItem("pro_delivery_geocode_cache_v1") || "{}"
        ) || {};
    } catch {}

    const key = address.toLowerCase().replace(/\s+/g, " ").trim();

    if (
        cache[key] &&
        Number.isFinite(Number(cache[key].lat)) &&
        Number.isFinite(Number(cache[key].lon))
    ) {
        parcel.lat = Number(cache[key].lat);
        parcel.lon = Number(cache[key].lon);
        return true;
    }

    const url =
        GEOCODE_BACKEND_URL +
        "?q=" + encodeURIComponent(address) +
        "&lat=" + encodeURIComponent(lastLat ?? "") +
        "&lon=" + encodeURIComponent(lastLon ?? "");

    const response = await fetch(url);

    if (!response.ok) return false;

    const data = await response.json();

    if (
        !data.success ||
        !Number.isFinite(Number(data.lat)) ||
        !Number.isFinite(Number(data.lon))
    ) {
        return false;
    }

    parcel.lat = Number(data.lat);
    parcel.lon = Number(data.lon);

    cache[key] = {
        lat: parcel.lat,
        lon: parcel.lon,
        provider: data.provider,
        savedAt: new Date().toISOString()
    };

    localStorage.setItem(
        "pro_delivery_geocode_cache_v1",
        JSON.stringify(cache)
    );

    return true;
}

function getCurrentGPS() {
    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
            reject(new Error("الجهاز لا يدعم GPS."));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position => {
                lastLat = position.coords.latitude;
                lastLon = position.coords.longitude;

                localStorage.setItem("last_lat", lastLat);
                localStorage.setItem("last_lon", lastLon);

                resolve(position);
            },
            error => {
                reject(new Error(
                    error.code === 1
                        ? "اسمح للتطبيق باستخدام موقعك."
                        : "تعذر الحصول على موقعك الحالي."
                ));
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 30000
            }
        );
    });
}

async function optimizeRoute() {

    const candidates = parcels.filter(
        p =>
            p.status === "pending" ||
            p.status === "reattempt"
    );

    if (!candidates.length) {
        alert("لا توجد طرود متبقية.");
        return;
    }

    try {

        await getCurrentGPS();

        showLoading(true);

        let done = 0;

        for (const parcel of candidates) {

            try {
                await geocodeParcelForRoute(parcel);
            } catch (e) {
                console.warn("Geocoding:", e);
            }

            done++;

            document.getElementById("loading").textContent =
                `📍 تحديد مواقع الطرود ${done}/${candidates.length}`;

            // Public Nominatim: sequential requests.
            if (done < candidates.length) {
                await new Promise(
                    resolve => setTimeout(resolve, 1100)
                );
            }
        }

        const located = candidates.filter(
            p =>
                Number.isFinite(Number(p.lat)) &&
                Number.isFinite(Number(p.lon))
        );

        if (!located.length) {
            throw new Error(
                "لم يتم العثور على إحداثيات لأي طرد."
            );
        }

        const remaining = [...located];
        const ordered = [];

        let currentLat = Number(lastLat);
        let currentLon = Number(lastLon);

        while (remaining.length) {

            let bestIndex = 0;
            let bestDistance = Infinity;

            remaining.forEach((parcel, i) => {

                const d = calculateDistance(
                    currentLat,
                    currentLon,
                    Number(parcel.lat),
                    Number(parcel.lon)
                );

                if (d < bestDistance) {
                    bestDistance = d;
                    bestIndex = i;
                }
            });

            const parcel =
                remaining.splice(bestIndex, 1)[0];

            parcel.routeOrder =
                ordered.length + 1;

            parcel.routeDistanceKm =
                Number(bestDistance.toFixed(2));

            ordered.push(parcel);

            currentLat = Number(parcel.lat);
            currentLon = Number(parcel.lon);
        }

        saveAndSync();

        renderAdvancedLists();

        showNextRouteStop(ordered);

        showParcelSection("route");

        document.getElementById("loading").textContent =
            `✅ تم ترتيب ${ordered.length} طرد.`;

    } catch (error) {

        alert(
            error.message ||
            "تعذر ترتيب المسار."
        );

    } finally {

        setTimeout(
            () => showLoading(false),
            1000
        );
    }
}

function showNextRouteStop(ordered) {

    const next =
        ordered[0] ||
        parcels.find(
            p =>
                p.status === "pending" ||
                p.status === "reattempt"
        );

    const box =
        document.getElementById("nextStop");

    if (!box || !next) return;

    box.style.display = "block";

    box.innerHTML = `
        <b>🚚 الطرد التالي للتسليم</b><br>
        👤 ${escapeHTML(next.name || "بدون اسم")}<br>
        📍 ${escapeHTML(getAddress(next))}<br>
        ${
            next.routeDistanceKm != null
                ? `📏 ${Number(next.routeDistanceKm).toFixed(2)} كم`
                : ""
        }
        <br>
        <button
            class="action-btn map-btn"
            style="margin-top:6px;width:100%;"
            onclick="openNavigation(parcels[${parcels.indexOf(next)}])"
        >
            🧭 ابدأ الملاحة
        </button>
    `;
}

/* =====================================================
   LOADING
===================================================== */

function showLoading(
    show
) {

    document.getElementById(
        "loading"
    ).style.display =
        show
            ? "block"
            : "none";
}


/* =====================================================
   REPORT
===================================================== */

function generateReport() {

    const total =
        parcels.length;


    const delivered =
        parcels.filter(
            p =>
                p.status ===
                "delivered"
        ).length;


    const absent =
        parcels.filter(
            p =>
                p.status ===
                "absent"
        ).length;


    const remaining =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        ).length;


    const success =
        total
            ? (
                delivered /
                total *
                100
            ).toFixed(1)
            : "0";


    const today =
        new Date()
            .toLocaleDateString(
                "ar-EG"
            );


    const report = `

📦 تقرير تسليم الطرود
${today}

--------------------------------

🔹 إجمالي الطرود:
${total}

✅ تم التسليم:
${delivered}

❌ غياب:
${absent}

⏳ المتبقي:
${remaining}

📈 نسبة النجاح:
${success}%

🚶‍♂️ المسافة:
${totalDistance.toFixed(2)} كم

--------------------------------

تم إنشاء التقرير بواسطة Pro Delivery.

`.trim();


    document.getElementById(
        "reportBox"
    ).innerText =
        report;


    document.getElementById(
        "reportModal"
    ).classList.add(
        "show"
    );
}


function copyReport() {

    const text =
        document.getElementById(
            "reportBox"
        ).innerText;


    navigator.clipboard
        .writeText(text)
        .then(
            () =>
                alert(
                    "تم نسخ التقرير."
                )
        );
}


function closeReportModal() {

    document.getElementById(
        "reportModal"
    ).classList.remove(
        "show"
    );
}

   CLOSE MODALS BY OUTSIDE CLICK
===================================================== */

window.addEventListener(
    "click",
    event => {

        if (
            event.target.id ===
            "parcelModal"
        ) {

            closeParcelModal();

        if (

===================================================== */

function updateConnection() {

    document.getElementById(
        "connectionStatus"
    ).innerText =
        navigator.onLine
            ? "🟢 متصل بالإنترنت"
            : "🟠 بدون إنترنت — الوضع المحلي يعمل";
}


window.addEventListener(
    "online",
    updateConnection
);

window.addEventListener(
    "offline",
    updateConnection
);

updateConnection();
