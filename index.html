<script>

/* =====================================================
   DATABASE / DATA

let parcels =

let totalDistance =

/* =====================================================
   INITIALIZE
===================================================== */

updateUI();
initTracker();
initAI();


/* =====================================================
   AI CAMERA
===================================================== */

const AI_BACKEND_URL =
    "https://pro-delivery-ai.yasserkhalil.workers.dev";

const GEOCODE_BACKEND_URL = AI_BACKEND_URL + "/geocode";


function initAI() {

    const button =
        document.getElementById(
            "aiScanBtn"
        );

    const input =
        document.getElementById(
            "aiCameraInput"
        );

    if (!button || !input)
        return;


    button.addEventListener(
        "click",
        () => {

            input.click();

        }
    );


    input.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files?.[0];

            event.target.value = "";

            if (!file)
                return;


            showLoading(true);

            button.disabled = true;

            button.innerText =
                "🤖 جاري تحليل الورقة...";


            try {

                const image =
                    await fileToDataURL(
                        file
                    );


                const result =
                    await analyzeAddressWithAI(
                        image
                    );


                openParcelForm(
                    result
                );


            } catch(error) {

                console.error(error);

                alert(
                    "تعذر تحليل الصورة:\n\n" +
                    error.message
                );

            } finally {

                showLoading(false);

                button.disabled =
                    false;

                button.innerText =
                    "🤖 📷 قراءة العنوان بالـAI";
            }

        }
    );
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function analyzeAddressWithAI(
    image
) {

    if (
        !AI_BACKEND_URL ||
        AI_BACKEND_URL.includes(
            "ضع_هنا"
        )
    ) {

        throw new Error(
            "ضع رابط الـBackend في AI_BACKEND_URL داخل index.html."
        );
    }


    const response =
        await fetch(
            AI_BACKEND_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: image
                })
            }
        );


    if (!response.ok) {

        let message =
            "فشل الاتصال بالـAI.";

        try {

            const data =
                await response.json();

            message =
                data.error ||
                message;

        } catch {}

        throw new Error(
            message
        );
    }


    const data =
        await response.json();


    if (!data.success) {

        throw new Error(
            data.error ||
            "فشل تحليل الصورة."
        );
    }


    return data.data || {};
}




/* =====================================================
   BATCH PARCEL IMPORT
   Add one or many parcel images in one operation.
   Each image may contain one parcel or several labels.
===================================================== */

function normalizeBatchParcel(item) {
    if (!item || typeof item !== "object") return null;

    const address =
        item.address ||
        item.fullAddress ||
        [item.street || "", item.houseNumber || item.house || "", item.postalCode || item.zip || "", item.city || ""]
            .filter(Boolean).join(" ").trim();

    const parcel = {
        id: Date.now() + Math.floor(Math.random() * 1000000),
        name: String(item.name || item.recipientName || "").trim(),
        street: String(item.street || "").trim(),
        house: String(item.houseNumber || item.house || "").trim(),
        zip: String(item.postalCode || item.zip || "").trim(),
        city: String(item.city || "").trim(),
        phone: String(item.phone || "").trim(),
        barcode: String(item.trackingNumber || item.barcode || "").trim(),
        notes: String(item.notes || "").trim(),
        status: "pending",
        proofUrl: null,
        signatureUrl: null,
        deliveredAt: null,
        signatureAt: null,
        lat: null,
        lon: null,
        routeOrder: null,
        routeDistanceKm: null,
        createdAt: new Date().toISOString()
    };

    // If Gemini returned only a combined address, preserve it in notes so it
    // is not lost; the normal getAddress() function can still use the fields.
    if (!parcel.street && address) parcel.notes = parcel.notes || address;

    if (!parcel.street && !parcel.city && !parcel.name && !address) return null;
    return parcel;
}

async function analyzeBatchImage(file) {
    const image = await fileToDataURL(file);

    const response = await fetch(
        AI_BACKEND_URL + "/analyze-image",
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                image,
                mimeType: file.type || "image/jpeg",
                prompt: `
حلل صورة تحتوي على ملصق واحد أو عدة ملصقات طرود.
استخرج جميع الطرود الظاهرة في الصورة. لا تتوقف عند أول طرد.
أعد JSON فقط بهذا الشكل:
{
  "packages": [
    {
      "name": "",
      "address": "",
      "street": "",
      "houseNumber": "",
      "postalCode": "",
      "city": "",
      "phone": "",
      "trackingNumber": "",
      "notes": ""
    }
  ]
}
لا تخمن البيانات. إذا لم تكن قيمة واضحة اتركها فارغة.
                `.trim()
            })
        }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
        throw new Error(data.error || "فشل تحليل صورة الدفعة");
    }

    let packages = data.data?.packages || data.data?.parcels || data.packages || [];

    // If the model returned one parcel object instead of an array, accept it.
    if (!Array.isArray(packages) && data.data && typeof data.data === "object") {
        packages = [data.data];
    }

    return Array.isArray(packages) ? packages : [];
}

function parcelDedupKey(p) {
    const tracking = String(p.barcode || "").replace(/\s+/g, "").toLowerCase();
    if (tracking) return "tracking:" + tracking;
    return [p.street, p.house, p.zip, p.city, p.name]
        .map(v => String(v || "").trim().toLowerCase())
        .join("|");
}

async function importAllParcelsBatch(files) {
    if (!files || !files.length) return;

    const batchBtn = document.getElementById("batchImportBtn");
    if (batchBtn) batchBtn.disabled = true;
    showLoading(true);

    const detected = [];

    try {
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            document.getElementById("loading").textContent =
                `🤖 قراءة الطرود ${i + 1}/${files.length}...`;

            const items = await analyzeBatchImage(file);
            detected.push(...items);
        }

        const existingKeys = new Set(parcels.map(parcelDedupKey));
        const added = [];
        const seen = new Set();

        for (const item of detected) {
            const p = normalizeBatchParcel(item);
            if (!p) continue;

            const key = parcelDedupKey(p);
            if (!key || seen.has(key) || existingKeys.has(key)) continue;

            seen.add(key);
            added.push(p);
        }

        parcels.push(...added);
        saveAndSync();

        // Show the normal parcel list immediately.
        showParcelView("all");

        alert(
            `تمت إضافة ${added.length} طرد من أصل ${detected.length} طرد مقروء.` +
            (detected.length !== added.length
                ? "\nتم تجاهل المكرر أو البيانات غير الكافية."
                : "")
        );

    } catch (error) {
        console.error(error);
        alert("تعذر إضافة الطرود دفعة واحدة:\n\n" + (error.message || error));
    } finally {
        showLoading(false);
        if (batchBtn) batchBtn.disabled = false;
    }
}

function initBatchImport() {
    const button = document.getElementById("batchImportBtn");
    const input = document.getElementById("batchImportInput");
    if (!button || !input) return;

    button.addEventListener("click", () => input.click());

    input.addEventListener("change", async event => {
        const files = Array.from(event.target.files || []);
        event.target.value = "";
        await importAllParcelsBatch(files);
    });
}

   GPS
===================================================== */

function initTracker() {

    if (
        "geolocation"
        in navigator
    ) {

        navigator.geolocation.watchPosition(

            position => {

                const currentLat =
                    position.coords.latitude;

                const currentLon =
                    position.coords.longitude;


                if (
                    lastLat !== null &&
                    lastLon !== null
                ) {

                    const distance =
                        calculateDistance(
                            lastLat,
                            lastLon,
                            currentLat,
                            currentLon
                        );


                    if (
                        distance > 0.005 &&
                        distance < 2.0
                    ) {

                        totalDistance +=
                            distance;

                        localStorage.setItem(
                            "saved_distance",
                            totalDistance
                        );

                        updateUI();
                    }
                }


                lastLat =
                    currentLat;

                lastLon =
                    currentLon;


                localStorage.setItem(
                    "last_lat",
                    lastLat
                );

                localStorage.setItem(
                    "last_lon",
                    lastLon
                );

            },

            error => {

                console.log(
                    "GPS:",
                    error
                );

            },

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    5000,

                timeout:
                    15000
            }
        );
    }
}


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        deg2rad(
            lat2 - lat1
        );

    const dLon =
        deg2rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            deg2rad(lat1)
        ) *
        Math.cos(
            deg2rad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;
}


function deg2rad(deg) {

    return (
        deg *
        (Math.PI / 180)
    );
}

===================================================== */

async function loadTesseractScript() {

    if (
        window.Tesseract
    ) {

        return window.Tesseract;
    }


    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

            script.onload =
                () =>
                    resolve(
                        window.Tesseract
                    );

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );
        }
    );
}


async function processImage(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    showLoading(true);


    try {

        const TesseractLib =
            await loadTesseractScript();


        const result =
            await TesseractLib.recognize(
                file,
                "eng+deu"
            );


        const text =
            result.data.text.trim();


        const parsed =
            parseAddressText(
                text
            );


        openParcelForm(
            parsed
        );


    } catch(error) {

        console.error(error);

        alert(
            "خطأ بقراءة الصورة."
        );

    } finally {

        showLoading(false);

        event.target.value = "";
    }
}


function parseAddressText(
    text
) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                x => x.trim()
            )
            .filter(
                x =>
                    x.length > 2
            );


    const zipMatch =
        text.match(
            /\b\d{5}\b/
        );


    const zip =
        zipMatch
            ? zipMatch[0]
            : "";


    let street = "";
    let house = "";


    for (
        const line
        of lines
    ) {

        const match =
            line.match(
                /^(.+?)\s+(\d+[a-zA-Z]?(?:-\d+[a-zA-Z]?)?)$/
            );


        if (match) {

            street =
                match[1].trim();

            house =
                match[2].trim();

            break;
        }
    }


    let city = "";


    if (zip) {

        const afterZip =
            text
                .slice(
                    text.indexOf(zip) + 5
                )
                .split(/\r?\n/)
                .map(
                    x =>
                        x.trim()
                )
                .filter(Boolean);


        city =
            afterZip[0] || "";
    }


    const phoneMatch =
        text.match(
            /(?:\+49|0049|0)\s?[\d\s()/.-]{8,}/
        );


    return {

        name:
            lines[1] ||
            lines[0] ||
            "",

        street,

        house,

        zip,

        city,

        phone:
            phoneMatch
                ? phoneMatch[0].trim()
                : "",

        barcode: "",

        raw_text:
            text
    };
}

   BARCODE / QR

async function scanBarcode() {

    if (
        !("BarcodeDetector" in window)
    ) {

        alert(
            "BarcodeDetector غير مدعوم في هذا المتصفح. استخدم Chrome حديث."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video: {
                        facingMode:
                            "environment"
                    }
                });


        const video =
            document.createElement(
                "video"
            );


        video.style.position =
            "fixed";

        video.style.inset =
            "0";

        video.style.width =
            "100%";

        video.style.height =
            "100%";

        video.style.objectFit =
            "cover";

        video.style.zIndex =
            "9999";

        video.autoplay =
            true;

        video.playsInline =
            true;

        document.body.appendChild(
            video
        );


        video.srcObject =
            stream;


        const detector =
            new BarcodeDetector({
                formats: [
                    "qr_code",
                    "code_128",
                    "ean_13",
                    "ean_8",
                    "pdf417",
                    "data_matrix",
                    "aztec",
                    "upc_a",
                    "upc_e"
                ]
            });


        const scan =
            async () => {

                try {

                    const codes =
                        await detector.detect(
                            video
                        );


                    if (
                        codes.length
                    ) {

                        const value =
                            codes[0]
                                .rawValue;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        video.remove();


                        openParcelForm({
                            barcode:
                                value
                        });


                        return;
                    }

                } catch {}


                requestAnimationFrame(
                    scan
                );
            };


        scan();


    } catch(error) {

        alert(
            "تعذر فتح الكاميرا: " +
            error.message
        );
    }
}

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",
            "<":
                "&lt;",
            ">":
                "&gt;",
            '"':
                "&quot;",
            "'":
                "&#039;"
        }[char])
    );
}


function getAddress(
    parcel
) {

    const street =
        [
            parcel.street,
            parcel.house
        ]
            .filter(Boolean)
            .join(" ");


    const city =
        [
            parcel.zip,
            parcel.city
        ]
            .filter(Boolean)
            .join(" ");


    const address =
        [
            street,
            city
        ]
            .filter(Boolean)
            .join(", ");


    return (
        address ||
        parcel.address ||
        "عنوان غير مكتمل"
    );
}

/* =====================================================
   DELIVERED
===================================================== */

function markDelivered(
    index
) {

    const parcel = parcels[index];
    if (!parcel) return;

    parcel.status = "delivered";
    parcel.deliveredAt = new Date().toISOString();

    // Save the current GPS position when available.
    if (Number.isFinite(Number(lastLat)) && Number.isFinite(Number(lastLon))) {
        parcel.deliveryLat = Number(lastLat);
        parcel.deliveryLon = Number(lastLon);
    }

    saveAndSync();

    // Keep the user on the same page and show a clear confirmation.
    setTimeout(() => {
        try {
            alert("تم تأكيد تسليم الطرد وحفظه في History.");
        } catch (_) {}
    }, 0);
}


/* =====================================================
   ABSENT
===================================================== */

function markAbsent(
    index
) {

    const parcel =
        parcels[index];


    parcel.status =
        "absent";


    parcel.attempts =
        (parcel.attempts || 0) +
        1;


    if (parcel.phone) {

        const text =
            encodeURIComponent(
                "Hallo, ich habe versucht, Ihr Paket zuzustellen, aber Sie waren nicht zu Hause."
            );


        window.location.href =
            `sms:${parcel.phone}?body=${text}`;
    }


    saveAndSync();
}

/* =====================================================
   PROOF OF DELIVERY
===================================================== */

function takeProof(
    index
) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";

    input.capture =
        "environment";


    input.onchange =
        event => {

            const file =
                event.target.files?.[0];


            if (!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    parcels[index]
                        .proofUrl =
                        event.target.result;


                    parcels[index]
                        .status =
                        "delivered";


                    parcels[index]
                        .deliveredAt =
                        new Date()
                            .toISOString();


                    saveAndSync();
                };


            reader.readAsDataURL(
                file
            );
        };


    input.click();
}


/* =====================================================
   ROUTE
===================================================== */

function optimizeRoute() {

    if (
        !parcels.length
    ) {

        alert(
            "أضف طرودًا أولاً."
        );

        return;
    }


    if (
        lastLat === null ||
        lastLon === null
    ) {

        alert(
            "اسمح للتطبيق بالوصول إلى موقعك أولاً."
        );

        return;
    }


    let candidates =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        );


    if (
        !candidates.length
    ) {

        alert(
            "لا توجد طرود متبقية."
        );

        return;
    }


    const first =
        candidates
            .find(
                p =>
                    p.lat &&
                    p.lon
            );


    if (!first) {

        document.getElementById(
            "nextStop"
        ).style.display =
            "block";


        document.getElementById(
            "nextStop"
        ).innerHTML =
            "ℹ️ لتحسين المسار بدقة نحتاج إحداثيات الطرود. يمكن استخدام عنوان Google Maps لكل طرد.";

        return;
    }


    const distance =
        calculateDistance(
            lastLat,
            lastLon,
            first.lat,
            first.lon
        );


    document.getElementById(
        "nextStop"
    ).style.display =
        "block";


    document.getElementById(
        "nextStop"
    ).innerHTML = `

        <b>
            📍 أقرب طرد:
        </b>

        ${escapeHTML(
            first.name ||
            "بدون اسم"
        )}

        <br>

        ${escapeHTML(
            getAddress(first)
        )}

        <br>

        المسافة:
        ${distance.toFixed(2)}
        كم

    `;
}

/* =====================================================
   STABLE PARCEL VIEWS — DOES NOT TOUCH parcelsList
   ===================================================== */

function parcelDate(parcel) {
    return parcel.createdAt || parcel.deliveredAt || null;
}

function isParcelToday(parcel) {
    const raw = parcelDate(parcel);
    if (!raw) return false;
    const d = new Date(raw);
    if (Number.isNaN(d.getTime())) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() &&
           d.getMonth() === n.getMonth() &&
           d.getDate() === n.getDate();
}

function phoneForWhatsApp(phone) {
    let p = String(phone || '').replace(/[^\d+]/g,'');
    if (p.startsWith('00')) p = '+' + p.slice(2);
    if (p.startsWith('0')) p = '+49' + p.slice(1);
    return p.replace(/\D/g,'');
}

function parcelStatusHTML(parcel) {
    if (parcel.status === 'delivered') return '<span class="status-badge status-delivered">✓ تم التسليم</span>';
    if (parcel.status === 'absent') return '<span class="status-badge status-absent">✕ غياب</span>';
    if (parcel.status === 'reattempt') return '<span class="status-badge status-reattempt">🔄 إعادة</span>';
    return '<span class="status-badge">قيد الانتظار</span>';
}

function renderFilteredParcel(parcel, index) {
    const address = getAddress(parcel);
    const phone = parcel.phone || '';
    const wa = phoneForWhatsApp(phone);
    return `
        <div class="filter-card">
            <div class="parcel-info">
                <span>📦 #${index + 1}${parcel.barcode ? ' · ' + escapeHTML(parcel.barcode) : ''}</span>
                ${parcelStatusHTML(parcel)}
            </div>
            <div class="parcel-info">👤 ${escapeHTML(parcel.name || 'بدون اسم')}</div>
            <div class="address-box">📍 ${escapeHTML(address)}</div>
            ${parcel.routeOrder ? `<div class="route-mini">🔢 ترتيب المسار: ${parcel.routeOrder} · 📏 ${Number(parcel.routeDistanceKm || 0).toFixed(2)} كم</div>` : ''}
            ${parcel.deliveredAt ? `<div class="parcel-fields">🕐 تم التسليم: ${new Date(parcel.deliveredAt).toLocaleString('de-DE')}</div>` : ''}
            ${parcel.notes ? `<div class="parcel-fields">📝 ${escapeHTML(parcel.notes)}</div>` : ''}
            <div class="btn-group">
                <button class="action-btn map-btn" data-parcel-action="navigation" data-parcel-index="${index}" onclick="openParcelNavigation(${index})">🧭 ملاحة</button>
                ${phone ? `<a class="action-btn wa-btn" target="_blank" href="https://wa.me/${wa}">💬 WhatsApp</a>` : ''}
                ${phone ? `<a class="action-btn" style="background:#2563eb" href="tel:${escapeHTML(phone)}">📞 اتصال</a>` : ''}
                ${parcel.status !== 'delivered' ? `<button class="action-btn deliver-btn" data-parcel-action="deliver" data-parcel-index="${index}" onclick="markDelivered(${index})">✅ تسليم</button>` : ''}
                <button class="action-btn proof-btn" data-parcel-action="proof" data-parcel-index="${index}" onclick="takeProof(${index})">📸 صورة</button>
                <button class="action-btn" style="background:#9333ea" data-parcel-action="signature" data-parcel-index="${index}" onclick="openSignature(${index})">✍️ توقيع</button>
                <button class="action-btn edit-btn" data-parcel-action="edit" data-parcel-index="${index}" onclick="editParcel(${index})">✏️ تعديل</button>
            </div>
            ${parcel.proofUrl ? `<div style="margin-top:6px"><b>📸 صورة التسليم</b><img class="proof-img" src="${escapeHTML(parcel.proofUrl)}"></div>` : ''}
            ${parcel.signatureUrl ? `<div style="margin-top:6px"><b>✍️ توقيع المستلم</b><img class="proof-img" src="${escapeHTML(parcel.signatureUrl)}"></div>` : ''}
            ${parcel.status === 'delivered' && phone ? `<button class="action-main-btn" style="background:#16a34a;margin-top:6px" onclick="sendDeliveryConfirmation(${index})">💬 تأكيد التسليم WhatsApp</button>` : ''}
        </div>`;
}

function showParcelView(view) {
    const box = document.getElementById('filteredParcelView');
    if (!box) return;

    const original = document.getElementById('parcelsList');
    const originalCard = original ? original.closest('.card') : null;

    // Keep the original "الطرود بالشنطة" list visible for ALL.
    if (originalCard) originalCard.style.display = view === 'all' ? 'block' : 'none';

    if (view === 'all') {
        box.style.display = 'none';
        return;
    }

    box.style.display = 'block';

    let list = [];
    if (view === 'today') {
        list = parcels.filter(isParcelToday);
    } else if (view === 'history') {
        list = parcels.filter(p => p.status === 'delivered');
    } else {
        list = parcels.filter(p => p.status === 'pending' || p.status === 'reattempt');
        list.sort((a,b) => Number(a.routeOrder || 999999) - Number(b.routeOrder || 999999));
    }

    const title = view === 'today' ? '📅 طرود اليوم' : view === 'history' ? '🕘 الطرود المستلمة' : '🚚 مسار التسليم';
    box.innerHTML = `<div style="font-weight:bold;color:#38bdf8;margin-bottom:6px">${title} <span class="section-count">(${list.length})</span></div>` +
        (list.length ? list.map(p => renderFilteredParcel(p, parcels.indexOf(p))).join('') : '<div class="empty">لا توجد طرود هنا.</div>');
}

function openParcelNavigation(index) {
    const p = parcels[index];
    const destination = Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lon))
        ? `${p.lat},${p.lon}`
        : getAddress(p);
    window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destination), '_blank');
}

function sendDeliveryConfirmation(index) {
    const p = parcels[index];
    const wa = phoneForWhatsApp(p.phone);
    if (!wa) return alert('لا يوجد رقم هاتف لهذا الطرد.');
    const text = 'Hallo, Ihr Paket wurde erfolgreich zugestellt. Vielen Dank!';
    window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank');
}

function openSignature(index) {
    let modal = document.getElementById('signatureModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'signatureModal';
        modal.className = 'modal show';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>✍️ توقيع المستلم</h3>
                <canvas id="signatureCanvas" class="signature-canvas" width="900" height="400"></canvas>
                <div class="modal-actions">
                    <button class="modal-btn" onclick="saveSignature()">✅ حفظ</button>
                    <button class="modal-btn close-btn" onclick="clearSignature()">🗑️ مسح</button>
                </div>
                <button class="modal-btn close-btn" style="width:100%;margin-top:6px" onclick="closeSignature()">إغلاق</button>
            </div>`;
        document.body.appendChild(modal);
        setupSignatureCanvas();
    }
    modal.dataset.index = String(index);
    modal.classList.add('show');
    clearSignature();
}

function setupSignatureCanvas() {
    const canvas = document.getElementById('signatureCanvas');
    if (!canvas || canvas.dataset.ready) return;
    canvas.dataset.ready = '1';
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#111827';
    let drawing = false;
    const point = e => {
        const r = canvas.getBoundingClientRect();
        const q = e.touches ? e.touches[0] : e;
        return {x:(q.clientX-r.left)*canvas.width/r.width, y:(q.clientY-r.top)*canvas.height/r.height};
    };
    const start = e => { drawing=true; const p=point(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
    const move = e => { if(!drawing)return; const p=point(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
    const stop = () => drawing=false;
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',stop); canvas.addEventListener('mouseleave',stop);
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',stop);
}

function clearSignature() {
    const c=document.getElementById('signatureCanvas');
    if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
}

function closeSignature() {
    const m=document.getElementById('signatureModal');
    if(m) m.classList.remove('show');
}

function saveSignature() {
    const m=document.getElementById('signatureModal');
    const c=document.getElementById('signatureCanvas');
    if(!m || !c) return;
    const index=Number(m.dataset.index);
    const pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
    let ink=false;
    for(let i=3;i<pixels.length;i+=4){ if(pixels[i]>0){ink=true;break;} }
    if(!ink) return alert('يرجى توقيع المستلم أولًا.');
    parcels[index].signatureUrl=c.toDataURL('image/png');
    parcels[index].signatureAt=new Date().toISOString();
    saveAndSync();
    closeSignature();
}

/* Preserve the original list: these additions only add filtered views. */
const originalSaveParcelForm = window.saveParcelForm;

async function geocodeForRoute(parcel) {
    if (Number.isFinite(Number(parcel.lat)) && Number.isFinite(Number(parcel.lon))) return true;
    const address = getAddress(parcel);
    if (!address || address === 'عنوان غير مكتمل') return false;
    try {
        const r = await fetch(GEOCODE_BACKEND_URL + '?q=' + encodeURIComponent(address));
        const d = await r.json();
        if (!d.success || !Number.isFinite(Number(d.lat)) || !Number.isFinite(Number(d.lon))) return false;
        parcel.lat=Number(d.lat); parcel.lon=Number(d.lon);
        return true;
    } catch(e) { return false; }
}

async function optimizeRouteSafe() {
    const candidates=parcels.filter(p=>p.status==='pending'||p.status==='reattempt');
    if(!candidates.length) return alert('لا توجد طرود متبقية.');
    if(lastLat===null||lastLon===null) return alert('اسمح للتطبيق بالوصول إلى موقعك أولًا.');
    showLoading(true);
    try {
        for(let i=0;i<candidates.length;i++){
            await geocodeForRoute(candidates[i]);
            document.getElementById('loading').textContent=`📍 تحديد مواقع الطرود ${i+1}/${candidates.length}`;
            if(i<candidates.length-1) await new Promise(r=>setTimeout(r,1100));
        }
        const remaining=candidates.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon)));
        if(!remaining.length) throw new Error('لم يتم العثور على إحداثيات للطرود.');
        const ordered=[]; let lat=Number(lastLat), lon=Number(lastLon);
        while(remaining.length){
            let bi=0, bd=Infinity;
            remaining.forEach((p,i)=>{const d=calculateDistance(lat,lon,p.lat,p.lon);if(d<bd){bd=d;bi=i;}});
            const p=remaining.splice(bi,1)[0];
            p.routeOrder=ordered.length+1; p.routeDistanceKm=Number(bd.toFixed(2));
            ordered.push(p); lat=p.lat; lon=p.lon;
        }
        saveAndSync();
        showParcelView('route');
        const n=ordered[0];
        const next=document.getElementById('nextStop');
        if(next){next.style.display='block';next.innerHTML=`<b>🚚 الطرد التالي</b><br>📍 ${escapeHTML(getAddress(n))}<br>📏 ${n.routeDistanceKm} كم<br><button class="action-btn map-btn" style="width:100%;margin-top:5px" onclick="openParcelNavigation(${parcels.indexOf(n)})">🧭 الملاحة</button>`;}
    } catch(e){ alert(e.message||'تعذر ترتيب المسار.'); }
    finally { setTimeout(()=>showLoading(false),700); }
}

// Initialize views after the original UI has rendered. The original list remains the source of truth.
setTimeout(() => {
    parcels.forEach(p => { if(!p.createdAt) p.createdAt = p.id ? new Date(Number(p.id)).toISOString() : new Date().toISOString(); });
    localStorage.setItem('saved_parcels', JSON.stringify(parcels));
    showParcelView('all');
}, 0);


/* =====================================================
   ROBUST PARCEL ACTION HANDLERS
   Works for dynamically rendered parcel cards too.
===================================================== */

window.markDelivered = markDelivered;
window.markAbsent = markAbsent;
window.takeProof = takeProof;
window.openSignature = openSignature;
window.editParcel = editParcel;
window.openParcelNavigation = openParcelNavigation;
window.sendDeliveryConfirmation = sendDeliveryConfirmation;
window.showParcelView = showParcelView;

if (!window.__parcelActionHandlerInstalled) {
    window.__parcelActionHandlerInstalled = true;

    document.addEventListener('click', function (event) {
        const button = event.target.closest('[data-parcel-action]');
        if (!button) return;

        const action = button.dataset.parcelAction;
        const index = Number(button.dataset.parcelIndex);

        if (!Number.isInteger(index) || !parcels[index]) return;

        event.preventDefault();
        event.stopPropagation();

        try {
            if (action === 'deliver') markDelivered(index);
            else if (action === 'proof') takeProof(index);
            else if (action === 'signature') openSignature(index);
            else if (action === 'edit') editParcel(index);
            else if (action === 'absent') markAbsent(index);
            else if (action === 'navigation') openParcelNavigation(index);
            else if (action === 'whatsapp') sendDeliveryConfirmation(index);
        } catch (error) {
            console.error('Parcel action error:', error);
            alert('تعذر تنفيذ العملية. حاول مرة أخرى.');
        }
    });
}
