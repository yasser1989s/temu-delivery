<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Pro Delivery"
    >

    <title>Pro Delivery - منظم الطرود</title>

    <link
        rel="apple-touch-icon"
        href="https://img.icons8.com/color/192/delivery--v1.png"
    >

    <link
        rel="icon"
        href="https://img.icons8.com/color/48/delivery--v1.png"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 8px;
            direction: rtl;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 19px;
            margin: 8px 0 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        .stat-box {
            background: #1e293b;
            padding: 7px;
            border-radius: 7px;
            border: 1px solid #334155;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-box span {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 3px;
        }

        .card {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #334155;
        }

        .action-main-btn {
            display: block;
            width: 100%;
            background: #0284c7;
            color: white;
            text-align: center;
            padding: 11px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 6px;
            border: none;
        }

        .action-main-btn:active {
            transform: scale(.98);
        }

        .ai-btn {
            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );
        }

        .paste-btn {
            background: #059669;
        }

        .voice-btn {
            background: #db2777;
        }

        .report-btn {
            background: #4f46e5;
        }

        .reset-btn {
            background: #334155;
            color: #ef4444;
            border: 1px solid #475569;
        }

        .loading {
            text-align: center;
            color: #fbbf24;
            font-weight: bold;
            margin-top: 8px;
            font-size: 13px;
            display: none;
        }

        .connection {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin: 5px 0;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #334155;
            border: 1px solid #475569;
            padding: 9px;
            border-radius: 7px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .parcel-info {
            font-size: 12px;
            color: #f1f5f9;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }

        .address-box {
            font-size: 13px;
            color: #cbd5e1;
            background: #0f172a;
            padding: 7px;
            border-radius: 5px;
            line-height: 1.6;
        }

        .parcel-fields {
            background: #1e293b;
            border-radius: 5px;
            padding: 6px;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .btn-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 7px 2px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            color: white;
            min-width: 60px;
        }

        .map-btn {
            background: #2563eb;
        }

        .sms-btn {
            background: #d97706;
        }

        .wa-btn {
            background: #16a34a;
        }

        .absent-btn {
            background: #dc2626;
        }

        .deliver-btn {
            background: #15803d;
        }

        .proof-btn {
            background: #7c3aed;
        }

        .edit-btn {
            background: #475569;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #475569;
            color: #fff;
            white-space: nowrap;
        }

        .status-delivered {
            background: #15803d;
        }

        .status-absent {
            background: #b91c1c;
        }

        .status-reattempt {
            background: #d97706;
        }

        .proof-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 5px;
            margin-top: 3px;
            border: 1px solid #64748b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin: 10px 0;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,.75);
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 430px;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid #475569;
        }

        .modal-content h3 {
            color: #38bdf8;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .form-input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .modal-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .modal-btn {
            flex: 1;
            background: #059669;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn {
            background: #dc2626;
        }

        .report-text {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 13px;
            text-align: right;
            white-space: pre-line;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        /* AI Preview */

        .ai-status {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 11px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .next-stop {
            background: #172554;
            border: 1px solid #2563eb;
            border-radius: 7px;
            padding: 8px;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 8px;
            display: none;
        }

    
/* =========================================================
           MODERN PRO DELIVERY UI
           Keeps existing IDs, handlers and parcel logic unchanged.
           ========================================================= */

        :root {
            --bg: #07111f;
            --panel: rgba(17, 29, 48, .92);
            --panel-2: rgba(22, 37, 60, .94);
            --line: rgba(148, 163, 184, .16);
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #38bdf8;
            --violet: #8b5cf6;
            --green: #34d399;
            --yellow: #fbbf24;
            --pink: #f472b6;
        }

        html {
            background: var(--bg);
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding:
                max(10px, env(safe-area-inset-top))
                12px
                calc(88px + env(safe-area-inset-bottom));
            background:
                radial-gradient(circle at 85% 0%, rgba(56,189,248,.16), transparent 30%),
                radial-gradient(circle at 10% 20%, rgba(139,92,246,.13), transparent 28%),
                linear-gradient(180deg, #07111f 0%, #0a1322 55%, #07111f 100%);
            color: var(--text);
        }

        .app-header {
            position: relative;
            overflow: hidden;
            margin: 2px 0 14px;
            padding: 16px;
            border: 1px solid rgba(148,163,184,.16);
            border-radius: 24px;
            background:
                linear-gradient(135deg, rgba(30,41,59,.94), rgba(15,23,42,.90));
            box-shadow: 0 16px 45px rgba(0,0,0,.25);
        }

        .app-header::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            left: -65px;
            top: -75px;
            background: rgba(56,189,248,.10);
            filter: blur(2px);
        }

        .brand-row,
        .time-panel {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-row {
            margin-bottom: 15px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            flex: 0 0 50px;
            border-radius: 17px;
            font-size: 27px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 10px 25px rgba(37,99,235,.28);
        }

        .brand-copy {
            flex: 1;
            text-align: right;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.4px;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 9px;
            border-radius: 999px;
            background: rgba(52,211,153,.10);
            border: 1px solid rgba(52,211,153,.20);
            color: #86efac;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .live-badge span,
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(52,211,153,.10), 0 0 12px rgba(52,211,153,.7);
        }

        .time-panel {
            padding: 12px 13px;
            border-radius: 17px;
            background: rgba(2,6,23,.30);
            border: 1px solid rgba(148,163,184,.10);
        }

        .live-time {
            font-size: 27px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 1px;
            direction: ltr;
            text-align: right;
        }

        .live-date {
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
        }

        .driver-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
        }

        .stats-grid {
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-box {
            position: relative;
            overflow: hidden;
            min-height: 76px;
            padding: 12px 8px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: linear-gradient(145deg, rgba(20,34,55,.96), rgba(13,24,40,.96));
            box-shadow: 0 8px 24px rgba(0,0,0,.14);
            font-size: 11px;
        }

        .stat-box::before {
            content: "";
            position: absolute;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            left: -18px;
            bottom: -24px;
            background: rgba(56,189,248,.08);
        }

        .stat-box span {
            font-size: 22px;
            margin-top: 7px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 3px 3px 8px;
            color: #e2e8f0;
        }

        .section-heading > div {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .section-kicker {
            color: #64748b;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .section-heading strong {
            font-size: 15px;
        }

        .section-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(139,92,246,.12);
            border: 1px solid rgba(139,92,246,.20);
        }

        .card {
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: 0 12px 35px rgba(0,0,0,.18);
            backdrop-filter: blur(14px);
        }

        .tools-card {
            padding: 12px;
        }

        .action-main-btn {
            min-height: 50px;
            margin-bottom: 8px;
            padding: 12px 14px;
            border-radius: 15px;
            font-size: 13px;
            box-shadow: 0 7px 18px rgba(0,0,0,.13);
            transition: transform .15s ease, filter .15s ease;
        }

        .action-main-btn:hover {
            filter: brightness(1.08);
        }

        .action-main-btn:active {
            transform: translateY(1px) scale(.985);
        }

        .loading {
            padding: 9px;
            border-radius: 12px;
            background: rgba(251,191,36,.08);
        }

        .connection {
            margin: 9px 0 1px;
            color: #86efac;
        }

        .next-stop {
            border-radius: 18px;
            margin: 10px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
        }

        .navigation-card {
            padding: 12px;
        }

        .nav-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 0 3px 10px;
        }

        .nav-title span {
            font-size: 15px;
            font-weight: 900;
        }

        .nav-title small {
            color: var(--muted);
            font-size: 9px;
        }

        .parcel-nav-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .nav-tile {
            min-width: 0;
            min-height: 70px;
            padding: 8px 4px;
            border: 1px solid transparent;
            border-radius: 16px;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font: inherit;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s ease, filter .15s ease;
        }

        .nav-tile:active {
            transform: scale(.96);
        }

        .nav-tile-icon {
            font-size: 21px;
            line-height: 1;
        }

        .nav-route {
            background: linear-gradient(145deg, #1d4ed8, #2563eb);
        }

        .nav-today {
            background: linear-gradient(145deg, #047857, #0f766e);
        }

        .nav-all {
            background: linear-gradient(145deg, #334155, #475569);
        }

        .nav-history {
            background: linear-gradient(145deg, #6d28d9, #7c3aed);
        }

        #filteredParcelView {
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }

        li {
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,.13);
            background: linear-gradient(145deg, rgba(30,41,59,.95), rgba(15,23,42,.92));
            box-shadow: 0 8px 22px rgba(0,0,0,.12);
        }

        .filter-card {
            border-radius: 15px;
            background: rgba(30,41,59,.78);
            border-color: rgba(148,163,184,.12);
        }

        .route-mini {
            border-radius: 12px;
            background: rgba(30,64,175,.22);
            border-color: rgba(59,130,246,.30);
        }

        /* Compact phones */
        @media (max-width: 380px) {
            body {
                padding-left: 9px;
                padding-right: 9px;
            }

            .brand-title {
                font-size: 19px;
            }

            .live-time {
                font-size: 24px;
            }

            .nav-tile {
                min-height: 64px;
                font-size: 9px;
            }

            .nav-tile-icon {
                font-size: 19px;
            }
        }

    
    </style>
</head>


<body>

    <header class="app-header">
        <div class="brand-row">
            <div class="brand-icon">📦</div>
            <div class="brand-copy">
                <div class="brand-title">Pro Delivery</div>
                <div class="brand-subtitle">مساعد توصيل ذكي</div>
            </div>
            <div class="live-badge"><span></span> مباشر</div>
        </div>
        <div class="time-panel">
            <div>
                <div id="liveTime" class="live-time">--:--</div>
                <div id="liveDate" class="live-date">---</div>
            </div>
            <div class="driver-status">
                <span class="status-dot"></span>
                جاهز للعمل
            </div>
        </div>
    </header>


    <!-- الإحصائيات -->

    <div class="stats-grid">

        <div class="stat-box">
            الإجمالي
            <span id="totalCount">0</span>
        </div>

        <div
            class="stat-box"
            style="color:#4ade80;"
        >
            تم التسليم
            <span
                id="deliveredCount"
                style="color:#4ade80;"
            >
                0
            </span>
        </div>

        <div
            class="stat-box"
            style="color:#facc15;"
        >
            المتبقي
            <span
                id="remainingCount"
                style="color:#facc15;"
            >
                0
            </span>
        </div>

        <div
            class="stat-box"
            style="color:#f87171;"
        >
            غياب
            <span
                id="absentCount"
                style="color:#f87171;"
            >
                0
            </span>
        </div>

        <div
            class="stat-box"
            style="color:#38bdf8; grid-column:span 2;"
        >
            المسافة
            <span
                id="distanceKm"
                style="color:#38bdf8;"
            >
                0.00 كم
            </span>
        </div>

    </div>


    <!-- التحكم -->

    <div class="section-heading">
        <div>
            <span class="section-kicker">SMART TOOLS</span>
            <strong>أدوات التوصيل</strong>
        </div>
        <span class="section-icon">⚡</span>
    </div>

    <div class="card tools-card">

        <!-- AI Camera -->

        <button
            id="aiScanBtn"
            class="action-main-btn ai-btn"
        >
            🤖 📷 قراءة العنوان مجانًا
        </button>

        <input
            id="aiCameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
        >


        <!-- OCR محلي احتياطي -->

        <input
            type="file"
            id="parcelImage"
            accept="image/*"
            capture="environment"
            hidden
            onchange="processImage(event)"
        >

        <button
            class="action-main-btn"
            onclick="document.getElementById('parcelImage').click()"
        >
            📄 OCR محلي
        </button>


        <!-- Barcode -->

        <button
            id="scanBarcodeBtn"
            class="action-main-btn"
            onclick="scanBarcode()"
        >
            🔳 مسح Barcode / QR
        </button>


        <!-- Clipboard -->

        <button
            class="action-main-btn paste-btn"
            onclick="pasteFromClipboard()"
        >
            📋 لصق العنوان
        </button>


        <!-- Voice -->

        <button
            class="action-main-btn voice-btn"
            onclick="startVoiceInput()"
        >
            🎤 إدخال عنوان صوتي
        </button>


        <!-- Optimize -->

        <button
            class="action-main-btn"
            style="background:#0ea5e9;"
            onclick="optimizeRoute()"
        >
            🗺️ أقرب طرد
        </button>


        <!-- Report -->

        <button
            class="action-main-btn report-btn"
            onclick="generateReport()"
        >
            📊 تقرير نهاية اليوم
        </button>


        <div
            id="loading"
            class="loading"
        >
            ⏳ جاري قراءة البيانات...
        </div>


        <div
            id="connectionStatus"
            class="connection"
        >
            🟢 التطبيق جاهز
        </div>

    </div>


    <!-- التالي -->

    <div
        id="nextStop"
        class="next-stop"
    ></div>


    <!-- الطرود -->

    <div
        class="card"
        style="padding:8px;"
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:6px;
            "
        >

            <h3
                style="
                    margin:0;
                    font-size:13px;
                "
            >
                الطرود بالشنطة:
            </h3>

            <button
                class="action-btn reset-btn"
                style="flex:none;"
                onclick="clearAllData()"
            >
                إعادة ضبط
            </button>

        </div>


        <ul id="parcelsList">

            <p
                class="empty"
                id="emptyMsg"
            >
                ما في طرود مضافة. ابدأ الإدخال!
            </p>

        </ul>

    </div>


    <!-- Modal إضافة/تعديل طرد -->

    <div
        id="parcelModal"
        class="modal"
    >

        <div class="modal-content">

            <h3>
                📦 بيانات الطرد
            </h3>


            <input
                type="hidden"
                id="editIndex"
            >


            <div class="form-group">

                <label>
                    Barcode / QR
                </label>

                <input
                    id="fBarcode"
                    class="form-input"
                    type="text"

let localOCRWorker = null;
let localOCRPromise = null;
let zxingPromise = null;

    const input = document.getElementById("aiCameraInput");

        );

async function loadTesseractScript() {

    if (window.Tesseract) return window.Tesseract;

    return new Promise((resolve, reject) => {

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
        script.async = true;

        script.onload = () => resolve(window.Tesseract);
        script.onerror = () => reject(
            new Error("تعذر تحميل محرك OCR. تأكد من اتصال الإنترنت.")
        );

        document.head.appendChild(script);
    });
}


async function getOCRWorker() {

    if (localOCRWorker) return localOCRWorker;
    if (localOCRPromise) return localOCRPromise;

    localOCRPromise = (async () => {

        const TesseractLib = await loadTesseractScript();

        // German + English is appropriate for German delivery labels.
        const worker = await TesseractLib.createWorker("deu+eng", 1, {
            logger: message => {

                if (message?.status === "recognizing text" && message.progress) {

                    const percent = Math.round(message.progress * 100);

                    const loading = document.getElementById("loading");
                    if (loading) {
                        loading.innerText =
                            `⏳ جاري قراءة الورقة محليًا... ${percent}%`;
                    }
                }
            }
        });

        localOCRWorker = worker;
        return worker;

    })();

    try {
        return await localOCRPromise;
    } catch (error) {
        localOCRPromise = null;
        throw error;
    }
}


function loadImage(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();
        const img = new Image();

        reader.onload = () => {
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("تعذر فتح الصورة."));
            img.src = reader.result;
        };

        reader.onerror = () => reject(new Error("تعذر قراءة الصورة."));
        reader.readAsDataURL(file);
    });
}


function makeOCRCanvas(img, mode = "normal") {

    const maxSide = 3000;
    const longest = Math.max(img.naturalWidth, img.naturalHeight);
    const scale = Math.min(1, maxSide / longest);

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));

    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    if (mode === "normal") return canvas;

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = imageData.data;

    for (let i = 0; i < px.length; i += 4) {

        const r = px[i];
        const g = px[i + 1];
        const b = px[i + 2];

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

        if (mode === "contrast") {
            gray = Math.max(0, Math.min(255, (gray - 128) * 1.65 + 128));
        }

        if (mode === "threshold") {
            gray = gray > 165 ? 255 : 0;
        }

        px[i] = gray;
        px[i + 1] = gray;
        px[i + 2] = gray;
    }

    ctx.putImageData(imageData, 0, 0);

    return canvas;
}


async function recognizeOCR(worker, image, label) {

    const loading = document.getElementById("loading");
    if (loading) loading.innerText = `⏳ ${label}`;

    const result = await worker.recognize(image);

    return {
        text: String(result?.data?.text || "").trim(),
        confidence: Number(result?.data?.confidence || 0)
    };
}


function scoreOCR(text, confidence) {

    let score = confidence;

    if (/\b\d{5}\b/.test(text)) score += 35;
    if (/\b(Göttingen|Goettingen|Berlin|Hamburg|München|Munich|Köln|Frankfurt)\b/i.test(text)) score += 10;
    if (/\b(Herr|Frau)\b/i.test(text)) score += 4;
    if (/\d+[a-zA-Z]?\s*$/m.test(text)) score += 12;
    if (/Straße|Strasse|Str\.|Weg|Allee|Platz|Ring|Gasse/i.test(text)) score += 15;

    return score;
}


async function scanDocumentLocally(file) {

    const worker = await getOCRWorker();
    const img = await loadImage(file);

    // Two passes give a useful accuracy boost on photographed paper:
    // a normal image and a contrast-enhanced image.
    const canvases = [
        makeOCRCanvas(img, "normal"),
        makeOCRCanvas(img, "contrast")
    ];

    const results = [];

    for (let i = 0; i < canvases.length; i++) {

        const result = await recognizeOCR(
            worker,
            canvases[i],
            i === 0
                ? "جاري قراءة النص..."
                : "جاري تحسين القراءة..."
        );

        if (result.text) results.push(result);
    }

    if (!results.length) {
        throw new Error(
            "لم يتمكن OCR من قراءة النص. صوّر الورقة بشكل مستقيم وبإضاءة جيدة."
        );
    }

    results.sort(
        (a, b) => scoreOCR(b.text, b.confidence) - scoreOCR(a.text, a.confidence)
    );

    const best = results[0];
    const parsed = parseAddressText(best.text);

    // Try QR/barcode directly from the original photo as well.
    try {
        const code = await detectBarcodeFromImage(file);
        if (code) parsed.barcode = code;
    } catch (error) {
        console.debug("Barcode image detection unavailable:", error);
    }

    parsed.raw_text = best.text;
    parsed.ocr_confidence = Math.round(best.confidence);

    return parsed;
}


function parseAddressText(text) {

    const clean = String(text || "")
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/[\t]+/g, " ")
        .replace(/ {2,}/g, " ");

    const lines = clean
        .split("\n")
        .map(x => x.replace(/^[\s•·,;:]+|[\s•·,;:]+$/g, "").trim())
        .filter(x => x.length >= 2);

    const zipMatch = clean.match(/\b(\d{5})\b/);
    const zip = zipMatch ? zipMatch[1] : "";

    let city = "";
    let zipLineIndex = -1;

    if (zip) {

        zipLineIndex = lines.findIndex(line => line.includes(zip));

        const zipLine = zipLineIndex >= 0 ? lines[zipLineIndex] : "";
        const afterZip = zipLine
            .replace(zip, "")
            .replace(/^[\s,.-]+/, "")
            .trim();

        if (afterZip && !/^\d+$/.test(afterZip)) {
            city = normalizeGerman(afterZip);
        }
    }

    // If the city is on the line after the PLZ, use it.
    if (!city && zipLineIndex >= 0 && lines[zipLineIndex + 1]) {
        const candidate = lines[zipLineIndex + 1].trim();
        if (
            candidate.length >= 2 &&
            !/^(Datum|Date|Zeichen|Ihr|Ihre|Herr|Frau)\b/i.test(candidate)
        ) {
            city = normalizeGerman(candidate);
        }
    }

    let street = "";
    let house = "";
    let streetIndex = -1;

    // German street/address line: "St.-Heinrich-Straße 28", "Hauptstr. 12a", etc.
    const streetRegex = /^(.+?)\s+(\d+[a-zA-Z]?\s*(?:[-/]\s*\d+[a-zA-Z]?)?)\s*$/;

    for (let i = 0; i < lines.length; i++) {

        const candidate = lines[i]
            .replace(/^(Herr|Frau)\s+/i, "")
            .trim();

        const match = candidate.match(streetRegex);

        if (!match) continue;

        const possibleStreet = match[1].trim();

        if (
            /straße|strasse|str\.?\b|weg\b|allee\b|platz\b|ring\b|gasse\b|chaussee\b|ufer\b/i.test(possibleStreet) ||
            /[.-]/.test(possibleStreet)
        ) {
            street = normalizeGerman(possibleStreet);
            house = match[2].replace(/\s+/g, "").trim();
            streetIndex = i;
            break;
        }
    }

    // Fallback: any line ending with a house number.
    if (!street) {
        for (let i = 0; i < lines.length; i++) {
            const match = lines[i].match(streetRegex);
            if (match) {
                street = normalizeGerman(match[1]);
                house = match[2].replace(/\s+/g, "");
                streetIndex = i;
                break;
            }
        }
    }

    // Strong fallback for a PLZ + city embedded in the full OCR text.
    if (!city && zip) {
        const cityMatch = clean.match(new RegExp(
            "\\b" + zip + "\\s+([A-Za-zÄÖÜäöüßÀ-ÿ][A-Za-zÄÖÜäöüßÀ-ÿ .-]{2,})"
        ));
        if (cityMatch) city = normalizeGerman(cityMatch[1]);
    }

    // Phone numbers.
    const phoneMatch = clean.match(
        /(?:\+49|0049|0)\s*(?:\(?\d{2,5}\)?[\s./-]*)\d[\d\s./-]{5,}\d/g
    );

    const phone = phoneMatch
        ? phoneMatch[0].replace(/\s{2,}/g, " ").trim()
        : "";

    // The recipient is usually immediately before the street line.
    let name = "";

    if (streetIndex > 0) {

        for (let i = streetIndex - 1; i >= 0; i--) {

            let candidate = lines[i]
                .replace(/^(Herr|Frau)\s*/i, "")
                .trim();

            if (!candidate) continue;

            if (/^(STADT|FACHBEREICH|DATUM|ZEICHEN|IHR|IHRE|SEHR|BETREFF|AN|VON)\b/i.test(candidate)) {
                continue;
            }

            if (/\d{5}/.test(candidate)) continue;

            name = candidate;
            break;
        }
    }

    if (!name) {

        const herrLine = lines.find(x => /^(Herr|Frau)\b/i.test(x));

        if (herrLine) {
            name = herrLine.replace(/^(Herr|Frau)\s*/i, "").trim();
        }
    }

    // Remove obvious OCR noise from the name.
    name = name.replace(/^[:;,.\-]+|[:;,.\-]+$/g, "").trim();

    return {
        name,
        street,
        house,
        zip,
        city,
        phone,
        barcode: "",
        raw_text: clean
    };
}


function normalizeGerman(value) {

    return String(value || "")
        .replace(/\bGoettingen\b/gi, "Göttingen")
        .replace(/\bStrasse\b/gi, "Straße")
        .replace(/\bStr\s*\.?\b/gi, "Str.")
        .replace(/\s+/g, " ")
        .trim();
}


async function detectBarcodeFromImage(file) {

    // Native BarcodeDetector when available.
    if ("BarcodeDetector" in window) {

        try {

            const supported = await BarcodeDetector.getSupportedFormats();

            const preferred = [
                "qr_code",
                "code_128",
                "code_39",
                "code_93",
                "ean_13",
                "ean_8",
                "itf",
                "pdf417",
                "data_matrix",
                "aztec",
                "upc_a",
                "upc_e"
            ];

            const formats = preferred.filter(x => supported.includes(x));

            if (formats.length) {

                const detector = new BarcodeDetector({ formats });
                const bitmap = await createImageBitmap(file);
                const codes = await detector.detect(bitmap);

                if (bitmap.close) bitmap.close();

                if (codes?.[0]?.rawValue) {
                    return codes[0].rawValue;
                }
            }

        } catch (error) {
            console.debug("Native barcode detector failed:", error);
        }
    }

    // QR fallback for browsers without BarcodeDetector.
    try {

        const jsQR = await loadJsQR();
        const img = await loadImage(file);
        const canvas = makeOCRCanvas(img, "normal");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "attemptBoth"
        });

        if (code?.data) return code.data;

    } catch (error) {
        console.debug("QR fallback failed:", error);
    }

    return "";
}


function loadJsQR() {

    if (window.jsQR) return Promise.resolve(window.jsQR);

    return new Promise((resolve, reject) => {

        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
        script.async = true;
        script.onload = () => resolve(window.jsQR);
        script.onerror = () => reject(new Error("تعذر تحميل قارئ QR."));
        document.head.appendChild(script);
    });
}

function initTracker() {

    if (
        "geolocation"
        in navigator
    ) {

        navigator.geolocation.watchPosition(

            position => {

                const currentLat =
                    position.coords.latitude;

                const currentLon =
                    position.coords.longitude;


                if (
                    lastLat !== null &&
                    lastLon !== null
                ) {

                    const distance =
                        calculateDistance(
                            lastLat,
                            lastLon,
                            currentLat,
                            currentLon
                        );


                    if (
                        distance > 0.005 &&
                        distance < 2.0
                    ) {

                        totalDistance +=
                            distance;

                        localStorage.setItem(
                            "saved_distance",
                            totalDistance
                        );

                        updateUI();
                    }
                }


                lastLat =
                    currentLat;

                lastLon =
                    currentLon;


                localStorage.setItem(
                    "last_lat",
                    lastLat
                );

                localStorage.setItem(
                    "last_lon",
                    lastLon
                );

            },

            error => {

                console.log(
                    "GPS:",
                    error
                );

            },

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    5000,

                timeout:
                    15000
            }
        );
    }
}


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        deg2rad(
            lat2 - lat1
        );

    const dLon =
        deg2rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            deg2rad(lat1)
        ) *
        Math.cos(
            deg2rad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;
}


function deg2rad(deg) {

    return (
        deg *
        (Math.PI / 180)
    );
}

                "data_matrix",
                "aztec",
                "upc_a",
                "upc_e"
            ];

            const formats = preferred.filter(x => supported.includes(x));

            if (formats.length) {
                await scanBarcodeNative(formats);
                return;
            }

        } catch (error) {
            console.debug("Native barcode scanner unavailable:", error);
        }
    }

    // Multi-format fallback for iPhone/Safari and browsers without BarcodeDetector.
    try {
        await scanBarcodeWithZXing();
    } catch (error) {
        alert(
            "تعذر تشغيل قارئ QR/Barcode.\n\n" +
            (error?.message || "تأكد من السماح بالكاميرا والاتصال بالإنترنت.")
        );
    }
}


async function scanBarcodeNative(formats) {

    const stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        }
    });

    const video = document.createElement("video");

    Object.assign(video.style, {
        position: "fixed",
        inset: "0",
        width: "100%",
        height: "100%",
        objectFit: "cover",
        zIndex: "9999",
        background: "#000"
    });

    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.srcObject = stream;

    const hint = document.createElement("div");
    hint.innerText = "وجّه الكاميرا إلى QR / Barcode — اضغط للرجوع";
    Object.assign(hint.style, {
        position: "fixed",
        top: "20px",
        left: "15px",
        right: "15px",
        zIndex: "10000",
        color: "white",
        background: "rgba(0,0,0,.65)",
        padding: "12px",
        borderRadius: "10px",
        textAlign: "center",
        fontWeight: "bold"
    });

    document.body.appendChild(video);
    document.body.appendChild(hint);

    const close = () => {
        stream.getTracks().forEach(track => track.stop());
        video.remove();
        hint.remove();
    };

    hint.addEventListener("click", close);

    await video.play().catch(() => {});

    const detector = new BarcodeDetector({ formats });
    let stopped = false;

    const scan = async () => {

        if (stopped) return;

        try {
            const codes = await detector.detect(video);

            if (codes?.length) {
                stopped = true;
                const value = codes[0].rawValue || "";
                close();
                openParcelForm({ barcode: value });
                return;
            }
        } catch (_) {}

        requestAnimationFrame(scan);
    };

    scan();
}


async function loadZXing() {

    if (window.ZXingBrowser) return window.ZXingBrowser;
    if (zxingPromise) return zxingPromise;

    zxingPromise = new Promise((resolve, reject) => {

        const script = document.createElement("script");
        script.src = "https://unpkg.com/@zxing/browser@0.2.1";
        script.async = true;

        script.onload = () => {
            if (window.ZXingBrowser) resolve(window.ZXingBrowser);
            else reject(new Error("لم يتم تحميل ZXing."));
        };

        script.onerror = () => reject(new Error("تعذر تحميل قارئ Barcode."));
        document.head.appendChild(script);
    });

    return zxingPromise;
}


async function scanBarcodeWithZXing() {

    const ZXing = await loadZXing();

    const Reader = ZXing.BrowserMultiFormatReader;

    if (!Reader) {
        throw new Error("قارئ Barcode متعدد الصيغ غير متاح.");
    }

    const reader = new Reader();

    const video = document.createElement("video");
    Object.assign(video.style, {
        position: "fixed",
        inset: "0",
        width: "100%",
        height: "100%",
        objectFit: "cover",
        zIndex: "9999",
        background: "#000"
    });
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    const hint = document.createElement("div");
    hint.innerText = "وجّه الكاميرا إلى QR / Barcode — اضغط هنا للإغلاق";
    Object.assign(hint.style, {
        position: "fixed",
        top: "20px",
        left: "15px",
        right: "15px",
        zIndex: "10000",
        color: "white",
        background: "rgba(0,0,0,.65)",
        padding: "12px",
        borderRadius: "10px",
        textAlign: "center",
        fontWeight: "bold"
    });

    document.body.appendChild(video);
    document.body.appendChild(hint);

    let controls = null;
    let closed = false;

    const close = () => {
        if (closed) return;
        closed = true;
        try { controls?.stop?.(); } catch (_) {}
        try { reader.reset?.(); } catch (_) {}
        video.srcObject?.getTracks?.().forEach(track => track.stop());
        video.remove();
        hint.remove();
    };

    hint.addEventListener("click", close);

    try {

        controls = await reader.decodeFromConstraints(
            {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            },
            video,
            (result) => {

                if (!result || closed) return;

                const value =
                    result.getText?.() ||
                    result.text ||
                    "";

                if (!value) return;

                close();
                openParcelForm({ barcode: value });
            }
        );

    } catch (error) {
        close();
        throw error;
    }
}

/* =====================================================
   UI
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",
            "<":
                "&lt;",
            ">":
                "&gt;",
            '"':
                "&quot;",
            "'":
                "&#039;"
        }[char])
    );
}


function getAddress(
    parcel
) {

    const street =
        [
            parcel.street,
            parcel.house
        ]
            .filter(Boolean)
            .join(" ");


    const city =
        [
            parcel.zip,
            parcel.city
        ]
            .filter(Boolean)
            .join(" ");


    const address =
        [
            street,
            city
        ]
            .filter(Boolean)
            .join(", ");


    return (
        address ||
        parcel.address ||
        "عنوان غير مكتمل"
    );
}

        parcels.filter(
            p =>
                p.status ===
                "absent"
        ).length;


    const remaining =

            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        ).length;


    document.getElementById(
        "totalCount"
    ).innerText =
        total;


    document.getElementById(
        "deliveredCount"
    ).innerText =
        delivered;

                        "Hallo, Ihr Paket wurde erfolgreich zugestellt. Vielen Dank!"

            const waUrl =

                    ? `https://wa.me/${phone.replace(
                        /\D/g,
                        ""
                    )}?text=${encodeURIComponent(
                        "Hallo, ich bin gerade in Ihrer Straße und habe Ihr Paket dabei."
                    )}`
                    : "#";


            let statusBadge =
                `<span class="status-badge">قيد الانتظار</span>`;


            if (
                parcel.status ===
                "delivered"
            ) {

                statusBadge =
                    `<span class="status-badge status-delivered">✓ تم</span>`;

            } else if (
                parcel.status ===
                "absent"
            ) {

                statusBadge =
                    `<span class="status-badge status-absent">✕ غياب</span>`;

            } else if (
                parcel.status ===
                "reattempt"
            ) {

                statusBadge =
                    `<span class="status-badge status-reattempt">🔄 إعادة</span>`;
            }


            const li =
                document.createElement(
                    "li"
                );


            li.innerHTML = `

                <div class="parcel-info">

                    <span>
                        📦 #${index + 1}
                        ${
                            parcel.barcode
                                ? " · " +
                                  escapeHTML(
                                      parcel.barcode
                                  )
                                : ""
                        }
                    </span>

                    ${statusBadge}

                </div>


                <div class="parcel-info">

                    <span>
                        ${escapeHTML(
                            parcel.name ||
                            "بدون اسم"
                        )}
                    </span>

                </div>


                <div class="address-box">

                    📍
                    ${escapeHTML(
                        address
                    )}

                </div>


                <div class="parcel-fields">

                    ${
                        parcel.phone
                            ? "📞 " +
                              escapeHTML(
                                  parcel.phone
                              )
                            : "📞 بدون هاتف"
                    }

                    ${
                        parcel.notes
                            ? "<br>📝 " +
                              escapeHTML(
                                  parcel.notes
                              )
                            : ""
                    }

                </div>


                <div class="btn-group">

                    <a
                        href="${mapsUrl}"
                        target="_blank"
                        class="action-btn map-btn"
                    >
                        🗺️ خريطة
                    </a>


                    ${
                        phone
                            ? `
                                <a
                                    href="${smsUrl}"
                                    class="action-btn sms-btn"
                                >
                                    💬 SMS
                                </a>
                            `
                            : ""
                    }


                    ${
                        phone
                            ? `
                                <a
                                    href="${waUrl}"
                                    target="_blank"
                                    class="action-btn wa-btn"
                                >
                                    🟢 واتساب

/* =====================================================
   DELIVERED
===================================================== */

function markDelivered(
    index
) {

    parcels[index].status =
        "delivered";


    parcels[index].deliveredAt =
        new Date()
            .toISOString();


    saveAndSync();
}


/* =====================================================
   ABSENT
===================================================== */

function markAbsent(
    index
) {

    const parcel =
        parcels[index];


    parcel.status =
        "absent";


    parcel.attempts =
        (parcel.attempts || 0) +
        1;


    if (parcel.phone) {

        const text =
            encodeURIComponent(
                "Hallo, ich habe versucht, Ihr Paket zuzustellen, aber Sie waren nicht zu Hause."
            );


        window.location.href =
            `sms:${parcel.phone}?body=${text}`;
    }


    saveAndSync();
}

   EDIT
===================================================== */

function editParcel(
    index
) {

    const parcel =
        parcels[index];


    document.getElementById(
        "editIndex"
    ).value =
        index;


    document.getElementById(
        "fBarcode"
    ).value =
        parcel.barcode ||
        "";


    document.getElementById(
        "fName"
    ).value =
        parcel.name ||
        "";


    document.getElementById(
        "fStreet"
    ).value =
        parcel.street ||
        "";


    document.getElementById(
        "fHouse"
    ).value =
        parcel.house ||
        "";


    document.getElementById(
        "fZip"
    ).value =
        parcel.zip ||
        "";


    document.getElementById(
        "fCity"
    ).value =
        parcel.city ||
        "";


    document.getElementById(
        "fPhone"
    ).value =
        parcel.phone ||
        "";


    document.getElementById(
        "fNotes"
    ).value =
        parcel.notes ||
        "";


    document.getElementById(
        "parcelModal"
    ).classList.add(
        "show"
    );
}


/* =====================================================
   PROOF OF DELIVERY
===================================================== */

function takeProof(
    index
) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";

    input.capture =
        "environment";


    input.onchange =
        event => {

            const file =
                event.target.files?.[0];


            if (!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    parcels[index]
                        .proofUrl =
                        event.target.result;


                    parcels[index]
                        .status =
                        "delivered";


                    parcels[index]
                        .deliveredAt =
                        new Date()
                            .toISOString();


                    saveAndSync();
                };


            reader.readAsDataURL(
                file
            );
        };


    input.click();
}


/* =====================================================
   ROUTE
===================================================== */

function optimizeRoute() {

    if (
        !parcels.length
    ) {

        alert(
            "أضف طرودًا أولاً."
        );

        return;
    }


    if (
        lastLat === null ||
        lastLon === null
    ) {

        alert(
            "اسمح للتطبيق بالوصول إلى موقعك أولاً."
        );

        return;
    }


    let candidates =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        );


    if (
        !candidates.length
    ) {

        alert(
            "لا توجد طرود متبقية."
        );

        return;
    }


    const first =
        candidates
            .find(
                p =>
                    p.lat &&
                    p.lon
            );


    if (!first) {

        document.getElementById(
            "nextStop"
        ).style.display =
            "block";


        document.getElementById(
            "nextStop"
        ).innerHTML =
            "ℹ️ لتحسين المسار بدقة نحتاج إحداثيات الطرود. يمكن استخدام عنوان Google Maps لكل طرد.";

        return;
    }


    const distance =
        calculateDistance(
            lastLat,
            lastLon,
            first.lat,
            first.lon
        );


    document.getElementById(
        "nextStop"
    ).style.display =
        "block";


    document.getElementById(
        "nextStop"
    ).innerHTML = `

        <b>
            📍 أقرب طرد:
        </b>

        ${escapeHTML(
            first.name ||
            "بدون اسم"
        )}

        <br>

        ${escapeHTML(
            getAddress(first)
        )}

        <br>

        المسافة:
        ${distance.toFixed(2)}
        كم

    `;
}

/* =====================================================

        parcels.length;


    const delivered =
        parcels.filter(
            p =>
                p.status ===
                "delivered"
        ).length;


    const absent =
        parcels.filter(
            p =>
                p.status ===
                "absent"
        ).length;


    const remaining =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        ).length;


    const success =
        total
            ? (
                delivered /
                total *
                100
            ).toFixed(1)
            : "0";


    const today =
        new Date()
            .toLocaleDateString(
                "ar-EG"
            );


    const report = `

📦 تقرير تسليم الطرود
${today}

--------------------------------

🔹 إجمالي الطرود:
${total}

✅ تم التسليم:
${delivered}

❌ غياب:
${absent}

⏳ المتبقي:
${remaining}

📈 نسبة النجاح:
${success}%

🚶‍♂️ المسافة:
${totalDistance.toFixed(2)} كم

--------------------------------

`.trim();


    document.getElementById(

}


function copyReport() {

    const text =

            "reportBox"
        ).innerText;


    navigator.clipboard
        .writeText(text)
        .then(
            () =>
                alert(

        );
}


function closeReportModal() {

    document.getElementById(
        "reportModal"
    ).classList.remove(
        "show"
    );
}
