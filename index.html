/* =====================================================
   DATABASE / DATA

let totalDistance =

        )

/* =====================================================
   INITIALIZE
===================================================== */

updateUI();
initTracker();
initAI();


/* =====================================================
   AI CAMERA
===================================================== */

const AI_BACKEND_URL =
    "https://pro-delivery-ai.yasserkhalil.workers.dev";


function initAI() {

    const button =
        document.getElementById(
            "aiScanBtn"
        );

    const input =
        document.getElementById(
            "aiCameraInput"
        );

    if (!button || !input)
        return;


    button.addEventListener(
        "click",
        () => {

            input.click();

        }
    );


    input.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files?.[0];

            event.target.value = "";

            if (!file)
                return;


            showLoading(true);

            button.disabled = true;

            button.innerText =
                "🤖 جاري تحليل الورقة...";


            try {

                const image =
                    await fileToDataURL(
                        file
                    );


                const result =
                    await analyzeAddressWithAI(
                        image
                    );


                openParcelForm(
                    result
                );


            } catch(error) {

                console.error(error);

                alert(
                    "تعذر تحليل الصورة:\n\n" +
                    error.message
                );

            } finally {

                showLoading(false);

                button.disabled =
                    false;

                button.innerText =
                    "🤖 📷 قراءة العنوان بالـAI";
            }

        }
    );
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function analyzeAddressWithAI(
    image
) {

    if (
        !AI_BACKEND_URL ||
        AI_BACKEND_URL.includes(
            "ضع_هنا"
        )
    ) {

        throw new Error(
            "ضع رابط الـBackend في AI_BACKEND_URL داخل index.html."
        );
    }


    const response =
        await fetch(
            AI_BACKEND_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: image
                })
            }
        );


    if (!response.ok) {

        let message =
            "فشل الاتصال بالـAI.";

        try {

            const data =
                await response.json();

            message =
                data.error ||
                message;

        } catch {}

        throw new Error(
            message
        );
    }


    const data =
        await response.json();


    if (!data.success) {

        throw new Error(
            data.error ||
            "فشل تحليل الصورة."
        );
    }


    return data.data || {};
}


/* =====================================================
   OPEN PARCEL FORM
===================================================== */

function openParcelForm(
    data = {}
) {

    document.getElementById(
        "editIndex"
    ).value = "";


    document.getElementById(
        "fBarcode"
    ).value =
        data.barcode || "";


    document.getElementById(
        "fName"
    ).value =
        data.name || "";


    document.getElementById(
        "fStreet"
    ).value =
        data.street || "";


    document.getElementById(
        "fHouse"
    ).value =
        data.house || "";


    document.getElementById(
        "fZip"
    ).value =
        data.zip || "";


    document.getElementById(
        "fCity"
    ).value =
        data.city || "";


    document.getElementById(
        "fPhone"
    ).value =
        data.phone || "";


    document.getElementById(
        "fNotes"
    ).value =
        data.raw_text || "";


    document.getElementById(

/* =====================================================
   GPS
===================================================== */

function initTracker() {

    if (
        "geolocation"
        in navigator
    ) {

        navigator.geolocation.watchPosition(

            position => {

                const currentLat =
                    position.coords.latitude;

                const currentLon =
                    position.coords.longitude;


                if (
                    lastLat !== null &&
                    lastLon !== null
                ) {

                    const distance =
                        calculateDistance(
                            lastLat,
                            lastLon,
                            currentLat,
                            currentLon
                        );


                    if (
                        distance > 0.005 &&
                        distance < 2.0
                    ) {

                        totalDistance +=
                            distance;

                        localStorage.setItem(
                            "saved_distance",
                            totalDistance
                        );

                        updateUI();
                    }
                }


                lastLat =
                    currentLat;

                lastLon =
                    currentLon;


                localStorage.setItem(
                    "last_lat",
                    lastLat
                );

                localStorage.setItem(
                    "last_lon",
                    lastLon
                );

            },

            error => {

                console.log(
                    "GPS:",
                    error
                );

            },

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    5000,

                timeout:
                    15000
            }
        );
    }
}


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        deg2rad(
            lat2 - lat1
        );

    const dLon =
        deg2rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            deg2rad(lat1)
        ) *
        Math.cos(
            deg2rad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;
}


function deg2rad(deg) {

    return (
        deg *
        (Math.PI / 180)
    );
}

   LOCAL OCR
===================================================== */

async function loadTesseractScript() {

    if (
        window.Tesseract
    ) {

        return window.Tesseract;
    }


    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

            script.onload =
                () =>
                    resolve(
                        window.Tesseract
                    );

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );
        }
    );
}


async function processImage(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    showLoading(true);


    try {

        const TesseractLib =
            await loadTesseractScript();


        const result =
            await TesseractLib.recognize(
                file,
                "eng+deu"
            );


        const text =
            result.data.text.trim();


        const parsed =
            parseAddressText(
                text
            );


        openParcelForm(
            parsed
        );


    } catch(error) {

        console.error(error);

        alert(
            "خطأ بقراءة الصورة."
        );

    } finally {

        showLoading(false);

        event.target.value = "";
    }
}


function parseAddressText(
    text
) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                x => x.trim()
            )
            .filter(
                x =>
                    x.length > 2
            );


    const zipMatch =
        text.match(
            /\b\d{5}\b/
        );


    const zip =
        zipMatch
            ? zipMatch[0]
            : "";


    let street = "";
    let house = "";


    for (
        const line
        of lines
    ) {

        const match =
            line.match(
                /^(.+?)\s+(\d+[a-zA-Z]?(?:-\d+[a-zA-Z]?)?)$/
            );


        if (match) {

            street =
                match[1].trim();

            house =
                match[2].trim();

            break;
        }
    }


    let city = "";


    if (zip) {

        const afterZip =
            text
                .slice(
                    text.indexOf(zip) + 5
                )
                .split(/\r?\n/)
                .map(
                    x =>
                        x.trim()
                )
                .filter(Boolean);


        city =
            afterZip[0] || "";
    }


    const phoneMatch =
        text.match(
            /(?:\+49|0049|0)\s?[\d\s()/.-]{8,}/
        );


    return {

        name:
            lines[1] ||
            lines[0] ||
            "",

        street,

        house,

        zip,

        city,

        phone:
            phoneMatch
                ? phoneMatch[0].trim()
                : "",

        barcode: "",

        raw_text:
            text
    };
}

/* =====================================================
   BARCODE / QR
===================================================== */

async function scanBarcode() {

    if (
        !("BarcodeDetector" in window)
    ) {

        alert(
            "BarcodeDetector غير مدعوم في هذا المتصفح. استخدم Chrome حديث."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video: {
                        facingMode:
                            "environment"
                    }
                });


        const video =
            document.createElement(
                "video"
            );


        video.style.position =
            "fixed";

        video.style.inset =
            "0";

        video.style.width =
            "100%";

        video.style.height =
            "100%";

        video.style.objectFit =
            "cover";

        video.style.zIndex =
            "9999";

        video.autoplay =
            true;

        video.playsInline =
            true;

        document.body.appendChild(
            video
        );


        video.srcObject =
            stream;


        const detector =
            new BarcodeDetector({
                formats: [
                    "qr_code",
                    "code_128",
                    "ean_13",
                    "ean_8",
                    "pdf417",
                    "data_matrix",
                    "aztec",
                    "upc_a",
                    "upc_e"
                ]
            });


        const scan =
            async () => {

                try {

                    const codes =
                        await detector.detect(
                            video
                        );


                    if (
                        codes.length
                    ) {

                        const value =
                            codes[0]
                                .rawValue;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        video.remove();


                        openParcelForm({
                            barcode:
                                value
                        });


                        return;
                    }

                } catch {}


                requestAnimationFrame(
                    scan
                );
            };


        scan();


    } catch(error) {

        alert(
            "تعذر فتح الكاميرا: " +
            error.message
        );
    }
}

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",
            "<":
                "&lt;",
            ">":
                "&gt;",
            '"':
                "&quot;",
            "'":
                "&#039;"
        }[char])
    );
}


function getAddress(
    parcel
) {

    const street =
        [
            parcel.street,
            parcel.house
        ]
            .filter(Boolean)
            .join(" ");


    const city =
        [
            parcel.zip,
            parcel.city
        ]
            .filter(Boolean)
            .join(" ");


    const address =
        [
            street,
            city
        ]
            .filter(Boolean)
            .join(", ");


    return (
        address ||
        parcel.address ||
        "عنوان غير مكتمل"
    );
}

function markDelivered(index) {
    currentDeliveryIndex = index;
    const parcel = parcels[index];
    parcel.status = "delivered";
    parcel.deliveredAt = parcel.deliveredAt || new Date().toISOString();
    saveAndSync();

    const label = document.getElementById("deliveryProofLabel");
    if (label) label.textContent = `${parcel.name || "مستلم"} — ${getAddress(parcel)}`;
    document.getElementById("deliveryProofModal").classList.add("show");
}

function completeDelivery(index, sendWhatsApp = true) {
    if (index == null || !parcels[index]) return;
    const parcel = parcels[index];
    parcel.status = "delivered";
    parcel.deliveredAt = parcel.deliveredAt || new Date().toISOString();
    parcel.confirmedAt = new Date().toISOString();
    saveAndSync();
    closeDeliveryProofModal();
    if (sendWhatsApp && parcel.phone) sendDeliveryWhatsApp(index);
    updateUI();
}

function closeDeliveryProofModal() {
    document.getElementById("deliveryProofModal").classList.remove("show");
}

function normalizeGermanPhone(phone) {
    let p = String(phone || "").trim().replace(/[^0-9+]/g, "");
    if (p.startsWith("00")) p = "+" + p.slice(2);
    if (p.startsWith("0")) p = "+49" + p.slice(1);
    if (p.startsWith("49")) p = "+" + p;
    return p;
}

function sendDeliveryWhatsApp(index) {
    const parcel = parcels[index];
    if (!parcel) return;
    const phone = normalizeGermanPhone(parcel.phone);
    if (!phone) {
        alert("لا يوجد رقم هاتف لهذا الطرد.");
        return;
    }
    const address = getAddress(parcel);
    const time = parcel.deliveredAt ? new Date(parcel.deliveredAt).toLocaleString("de-DE") : new Date().toLocaleString("de-DE");
    const text = `Hallo ${parcel.name || ""},

Ihr Paket wurde erfolgreich zugestellt.
📦 ${parcel.barcode || ""}
📍 ${address}
🕒 ${time}

Vielen Dank!`;
    const url = `https://wa.me/${phone.replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;
    parcel.whatsappPreparedAt = new Date().toISOString();
    saveAndSync();
    window.open(url, "_blank");
}

function openDeliveryHistory() {
    const list = document.getElementById("historyList");
    const delivered = parcels.filter(p => p.status === "delivered").sort((a,b) => new Date(b.deliveredAt || 0) - new Date(a.deliveredAt || 0));
    if (!delivered.length) {
        list.innerHTML = '<div class="empty">لا توجد طرود مستلمة بعد.</div>';
    } else {
        list.innerHTML = delivered.map(parcel => {
            const index = parcels.indexOf(parcel);
            const date = parcel.deliveredAt ? new Date(parcel.deliveredAt).toLocaleString("de-DE") : "غير مسجل";
            return `<div class="history-card">
                <strong>📦 ${escapeHTML(parcel.name || "بدون اسم")}</strong>
                <div class="history-meta">📍 ${escapeHTML(getAddress(parcel))}<br>📞 ${escapeHTML(parcel.phone || "بدون هاتف")}<br>🕒 ${escapeHTML(date)}<br>🔳 ${escapeHTML(parcel.barcode || "بدون Barcode")}</div>
                ${parcel.proofUrl ? `<img class="history-proof" src="${parcel.proofUrl}" alt="Proof of delivery">` : '<div class="history-meta">📸 لا توجد صورة تسليم</div>'}
                ${parcel.signatureUrl ? `<img class="signature-preview" src="${parcel.signatureUrl}" alt="Signature">` : '<div class="history-meta">✍️ لا يوجد توقيع</div>'}
                <div class="proof-status">${parcel.whatsappPreparedAt ? "🟢 رسالة WhatsApp جاهزة" : "⚪ لم يتم فتح رسالة WhatsApp"}</div>
                <div class="btn-group" style="margin-top:7px;">
                    ${parcel.phone ? `<button class="action-btn wa-btn" onclick="sendDeliveryWhatsApp(${index})">🟢 إرسال WhatsApp</button>` : ""}
                    <button class="action-btn proof-action-btn" onclick="takeProof(${index})">📸 صورة</button>
                    <button class="action-btn signature-btn" onclick="openSignature(${index})">✍️ توقيع</button>
                </div>
            </div>`;
        }).join("");
    }
    document.getElementById("historyModal").classList.add("show");
}

let currentDeliveryIndex = null;
let signatureIndex = null;
let signatureDrawing = false;
let signatureCtx = null;

function openSignature(index) {
    signatureIndex = index;
    const parcel = parcels[index];
    document.getElementById("signatureParcelLabel").textContent = `${parcel.name || "المستلم"} — ${getAddress(parcel)}`;
    document.getElementById("signatureModal").classList.add("show");
    setTimeout(() => setupSignaturePad(parcel.signatureUrl), 50);
}

function setupSignaturePad(existing) {
    const canvas = document.getElementById("signaturePad");
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    signatureCtx = canvas.getContext("2d");
    signatureCtx.scale(dpr, dpr);
    signatureCtx.lineWidth = 2.5;
    signatureCtx.lineCap = "round";
    signatureCtx.strokeStyle = "#111827";
    if (existing) {
        const img = new Image();
        img.onload = () => signatureCtx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = existing;
    }
    const point = e => {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    canvas.onpointerdown = e => { signatureDrawing = true; canvas.setPointerCapture(e.pointerId); const p = point(e); signatureCtx.beginPath(); signatureCtx.moveTo(p.x,p.y); };
    canvas.onpointermove = e => { if (!signatureDrawing) return; const p = point(e); signatureCtx.lineTo(p.x,p.y); signatureCtx.stroke(); };
    canvas.onpointerup = () => signatureDrawing = false;
    canvas.onpointercancel = () => signatureDrawing = false;
}

function clearSignaturePad() {
    const canvas = document.getElementById("signaturePad");
    if (!signatureCtx) return;
    const r = canvas.getBoundingClientRect();
    signatureCtx.clearRect(0, 0, r.width, r.height);
}

function saveSignature() {
    if (signatureIndex == null || !parcels[signatureIndex]) return;
    const canvas = document.getElementById("signaturePad");
    const data = canvas.toDataURL("image/png");
    parcels[signatureIndex].signatureUrl = data;
    parcels[signatureIndex].signatureAt = new Date().toISOString();
    parcels[signatureIndex].status = "delivered";
    parcels[signatureIndex].deliveredAt = parcels[signatureIndex].deliveredAt || new Date().toISOString();
    saveAndSync();
    closeSignatureModal();
    alert("تم حفظ توقيع المستلم.");
}

function closeSignatureModal() {
    document.getElementById("signatureModal").classList.remove("show");
    signatureIndex = null;
}

    saveAndSync();
}

/* =====================================================
   PROOF OF DELIVERY
===================================================== */

function takeProof(index) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.onchange = event => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const max = 1400;
                const scale = Math.min(1, max / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                parcels[index].proofUrl = canvas.toDataURL("image/jpeg", 0.78);
                parcels[index].proofTakenAt = new Date().toISOString();
                parcels[index].status = "delivered";
                parcels[index].deliveredAt = parcels[index].deliveredAt || new Date().toISOString();
                saveAndSync();
                updateUI();
                alert("تم حفظ صورة التسليم.");
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };
    input.click();
}


/* =====================================================
   ROUTE
===================================================== */

function optimizeRoute() {

    if (
        !parcels.length
    ) {

        alert(
            "أضف طرودًا أولاً."
        );

        return;
    }


    if (
        lastLat === null ||
        lastLon === null
    ) {

        alert(
            "اسمح للتطبيق بالوصول إلى موقعك أولاً."
        );

        return;
    }


    let candidates =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        );


    if (
        !candidates.length
    ) {

        alert(
            "لا توجد طرود متبقية."
        );

        return;
    }


    const first =
        candidates
            .find(
                p =>
                    p.lat &&
                    p.lon
            );


    if (!first) {

        document.getElementById(
            "nextStop"
        ).style.display =
            "block";


        document.getElementById(
            "nextStop"
        ).innerHTML =
            "ℹ️ لتحسين المسار بدقة نحتاج إحداثيات الطرود. يمكن استخدام عنوان Google Maps لكل طرد.";

        return;
    }


    const distance =
        calculateDistance(
            lastLat,
            lastLon,
            first.lat,
            first.lon
        );


    document.getElementById(
        "nextStop"
    ).style.display =
        "block";


    document.getElementById(
        "nextStop"
    ).innerHTML = `

        <b>
            📍 أقرب طرد:
        </b>

        ${escapeHTML(
            first.name ||
            "بدون اسم"
        )}

        <br>

        ${escapeHTML(
            getAddress(first)
        )}

        <br>

        المسافة:
        ${distance.toFixed(2)}
        كم

    `;
}

        ).length;

        parcels.filter(
            p =>
                p.status ===
                "absent"
        ).length;


    const remaining =
        parcels.filter(

                p.status ===

        ).length;


    const success =

                total *

${today}

--------------------------------

${total}

${delivered}

${totalDistance.toFixed(2)} كم

`.trim();

function closeReportModal() {
