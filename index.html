<script>

/* =====================================================
   DATABASE / DATA
===================================================== */

let parcels =
    JSON.parse(
        localStorage.getItem(
            "saved_parcels"
        )
    ) || [];

let totalDistance =
    parseFloat(
        localStorage.getItem(
            "saved_distance"
        )
    ) || 0;

let lastLat =
    parseFloat(
        localStorage.getItem(
            "last_lat"
        )
    ) || null;

let lastLon =
    parseFloat(
        localStorage.getItem(
            "last_lon"
        )
    ) || null;


/* =====================================================
   INITIALIZE
===================================================== */

updateUI();
initTracker();
initAI();


/* =====================================================
   AI CAMERA
===================================================== */

const AI_BACKEND_URL =
    "https://pro-delivery-ai.yasserkhalil.workers.dev";

const GEOCODE_BACKEND_URL =
    AI_BACKEND_URL + "/geocode";


function initAI() {

    const button =
        document.getElementById(
            "aiScanBtn"
        );

    const input =
        document.getElementById(
            "aiCameraInput"
        );

    if (!button || !input)
        return;


    button.addEventListener(
        "click",
        () => {

            input.click();

        }
    );


    input.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files?.[0];

            event.target.value = "";

            if (!file)
                return;


            showLoading(true);

            button.disabled = true;

            button.innerText =
                "🤖 جاري تحليل الورقة...";


            try {

                const image =
                    await fileToDataURL(
                        file
                    );


                const result =
                    await analyzeAddressWithAI(
                        image
                    );


                openParcelForm(
                    result
                );


            } catch(error) {

                console.error(error);

                alert(
                    "تعذر تحليل الصورة:\n\n" +
                    error.message
                );

            } finally {

                showLoading(false);

                button.disabled =
                    false;

                button.innerText =
                    "🤖 📷 قراءة العنوان بالـAI";
            }

        }
    );
}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );

            reader.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function analyzeAddressWithAI(
    image
) {

    if (
        !AI_BACKEND_URL ||
        AI_BACKEND_URL.includes(
            "ضع_هنا"
        )
    ) {

        throw new Error(
            "ضع رابط الـBackend في AI_BACKEND_URL داخل index.html."
        );
    }


    const response =
        await fetch(
            AI_BACKEND_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    image: image
                })
            }
        );


    if (!response.ok) {

        let message =
            "فشل الاتصال بالـAI.";

        try {

            const data =
                await response.json();

            message =
                data.error ||
                message;

        } catch {}

        throw new Error(
            message
        );
    }


    const data =
        await response.json();


    if (!data.success) {

        throw new Error(
            data.error ||
            "فشل تحليل الصورة."
        );
    }


    return data.data || {};
}


/* =====================================================
   OPEN PARCEL FORM
===================================================== */

function openParcelForm(
    data = {}
) {

    document.getElementById(
        "editIndex"
    ).value = "";


    document.getElementById(
        "fBarcode"
    ).value =
        data.barcode || "";


    document.getElementById(
        "fName"
    ).value =
        data.name || "";


    document.getElementById(
        "fStreet"
    ).value =
        data.street || "";


    document.getElementById(
        "fHouse"
    ).value =
        data.house || "";


    document.getElementById(
        "fZip"
    ).value =
        data.zip || "";


    document.getElementById(
        "fCity"
    ).value =
        data.city || "";


    document.getElementById(
        "fPhone"
    ).value =
        data.phone || "";


    document.getElementById(
        "fNotes"
    ).value =
        data.raw_text || "";


    document.getElementById(
        "parcelModal"
    ).classList.add(
        "show"
    );
}


function saveParcelForm() {

    const index =
        document.getElementById(
            "editIndex"
        ).value;


    const parcel = {

        id:
            index !== ""
                ? parcels[index].id
                : Date.now(),

        name:
            document.getElementById(
                "fName"
            ).value.trim(),

        street:
            document.getElementById(
                "fStreet"
            ).value.trim(),

        house:
            document.getElementById(
                "fHouse"
            ).value.trim(),

        zip:
            document.getElementById(
                "fZip"
            ).value.trim(),

        city:
            document.getElementById(
                "fCity"
            ).value.trim(),

        phone:
            document.getElementById(
                "fPhone"
            ).value.trim(),

        barcode:
            document.getElementById(
                "fBarcode"
            ).value.trim(),

        notes:
            document.getElementById(
                "fNotes"
            ).value.trim(),

        status:
            index !== ""
                ? parcels[index].status
                : "pending",

        proofUrl:
            index !== ""
                ? parcels[index].proofUrl
                : null
    };


    if (
        !parcel.street &&
        !parcel.city &&
        !parcel.name
    ) {

        alert(
            "أدخل على الأقل الاسم أو العنوان."
        );

        return;
    }


    if (index !== "") {

        parcels[index] =
            parcel;

    } else {

        parcels.push(
            parcel
        );

    }


    saveAndSync();

    closeParcelModal();
}


function closeParcelModal() {

    document.getElementById(
        "parcelModal"
    ).classList.remove(
        "show"
    );
}


/* =====================================================
   GPS
===================================================== */

function initTracker() {

    if (
        "geolocation"
        in navigator
    ) {

        navigator.geolocation.watchPosition(

            position => {

                const currentLat =
                    position.coords.latitude;

                const currentLon =
                    position.coords.longitude;


                if (
                    lastLat !== null &&
                    lastLon !== null
                ) {

                    const distance =
                        calculateDistance(
                            lastLat,
                            lastLon,
                            currentLat,
                            currentLon
                        );


                    if (
                        distance > 0.005 &&
                        distance < 2.0
                    ) {

                        totalDistance +=
                            distance;

                        localStorage.setItem(
                            "saved_distance",
                            totalDistance
                        );

                        updateUI();
                    }
                }


                lastLat =
                    currentLat;

                lastLon =
                    currentLon;


                localStorage.setItem(
                    "last_lat",
                    lastLat
                );

                localStorage.setItem(
                    "last_lon",
                    lastLon
                );

            },

            error => {

                console.log(
                    "GPS:",
                    error
                );

            },

            {
                enableHighAccuracy:
                    true,

                maximumAge:
                    5000,

                timeout:
                    15000
            }
        );
    }
}


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        deg2rad(
            lat2 - lat1
        );

    const dLon =
        deg2rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            deg2rad(lat1)
        ) *
        Math.cos(
            deg2rad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        );


    return R * c;
}


function deg2rad(deg) {

    return (
        deg *
        (Math.PI / 180)
    );
}

async function loadTesseractScript() {

    if (
        window.Tesseract
    ) {

        return window.Tesseract;
    }


    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

            script.onload =
                () =>
                    resolve(
                        window.Tesseract
                    );

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );
        }
    );
}


async function processImage(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    showLoading(true);


    try {

        const TesseractLib =
            await loadTesseractScript();


        const result =
            await TesseractLib.recognize(
                file,
                "eng+deu"
            );


        const text =
            result.data.text.trim();


        const parsed =
            parseAddressText(
                text
            );


        openParcelForm(
            parsed
        );


    } catch(error) {

        console.error(error);

        alert(
            "خطأ بقراءة الصورة."
        );

    } finally {

        showLoading(false);

        event.target.value = "";
    }
}


function parseAddressText(
    text
) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                x => x.trim()
            )
            .filter(
                x =>
                    x.length > 2
            );


    const zipMatch =
        text.match(
            /\b\d{5}\b/
        );


    const zip =
        zipMatch
            ? zipMatch[0]
            : "";


    let street = "";
    let house = "";


    for (
        const line
        of lines
    ) {

        const match =
            line.match(
                /^(.+?)\s+(\d+[a-zA-Z]?(?:-\d+[a-zA-Z]?)?)$/
            );


        if (match) {

            street =
                match[1].trim();

            house =
                match[2].trim();

            break;
        }
    }


    let city = "";


    if (zip) {

        const afterZip =
            text
                .slice(
                    text.indexOf(zip) + 5
                )
                .split(/\r?\n/)
                .map(
                    x =>
                        x.trim()
                )
                .filter(Boolean);


        city =
            afterZip[0] || "";
    }


    const phoneMatch =
        text.match(
            /(?:\+49|0049|0)\s?[\d\s()/.-]{8,}/
        );


    return {

        name:
            lines[1] ||
            lines[0] ||
            "",

        street,

        house,

        zip,

        city,

        phone:
            phoneMatch
                ? phoneMatch[0].trim()
                : "",

        barcode: "",

        raw_text:
            text
    };
}

   BARCODE / QR
===================================================== */

async function scanBarcode() {

    if (
        !("BarcodeDetector" in window)
    ) {

        alert(
            "BarcodeDetector غير مدعوم في هذا المتصفح. استخدم Chrome حديث."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    video: {
                        facingMode:
                            "environment"
                    }
                });


        const video =
            document.createElement(
                "video"
            );


        video.style.position =
            "fixed";

        video.style.inset =
            "0";

        video.style.width =
            "100%";

        video.style.height =
            "100%";

        video.style.objectFit =
            "cover";

        video.style.zIndex =
            "9999";

        video.autoplay =
            true;

        video.playsInline =
            true;

        document.body.appendChild(
            video
        );


        video.srcObject =
            stream;


        const detector =
            new BarcodeDetector({
                formats: [
                    "qr_code",
                    "code_128",
                    "ean_13",
                    "ean_8",
                    "pdf417",
                    "data_matrix",
                    "aztec",
                    "upc_a",
                    "upc_e"
                ]
            });


        const scan =
            async () => {

                try {

                    const codes =
                        await detector.detect(
                            video
                        );


                    if (
                        codes.length
                    ) {

                        const value =
                            codes[0]
                                .rawValue;


                        stream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );


                        video.remove();


                        openParcelForm({
                            barcode:
                                value
                        });


                        return;
                    }

                } catch {}


                requestAnimationFrame(
                    scan
                );
            };


        scan();


    } catch(error) {

        alert(
            "تعذر فتح الكاميرا: " +
            error.message
        );
    }
}

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":
                "&amp;",
            "<":
                "&lt;",
            ">":
                "&gt;",
            '"':
                "&quot;",
            "'":
                "&#039;"
        }[char])
    );
}


function getAddress(
    parcel
) {

    const street =
        [
            parcel.street,
            parcel.house
        ]
            .filter(Boolean)
            .join(" ");


    const city =
        [
            parcel.zip,
            parcel.city
        ]
            .filter(Boolean)
            .join(" ");


    const address =
        [
            street,
            city
        ]
            .filter(Boolean)
            .join(", ");


    return (
        address ||
        parcel.address ||
        "عنوان غير مكتمل"
    );
}

function takeProof(
    index
) {

    const input =
        document.createElement(
            "input"
        );


    input.type =
        "file";

    input.accept =
        "image/*";

    input.capture =
        "environment";


    input.onchange =
        event => {

            const file =
                event.target.files?.[0];


            if (!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    parcels[index]
                        .proofUrl =
                        event.target.result;


                    parcels[index]
                        .status =
                        "delivered";


                    parcels[index]
                        .deliveredAt =
                        new Date()
                            .toISOString();


                    saveAndSync();
                };


            reader.readAsDataURL(
                file
            );
        };


    input.click();
}

function optimizeRoute() {

    if (
        !parcels.length
    ) {

        alert(
            "أضف طرودًا أولاً."
        );

        return;
    }


    if (
        lastLat === null ||
        lastLon === null
    ) {

        alert(
            "اسمح للتطبيق بالوصول إلى موقعك أولاً."
        );

        return;
    }


    let candidates =
        parcels.filter(
            p =>
                p.status ===
                    "pending" ||
                p.status ===
                    "reattempt"
        );


    if (
        !candidates.length
    ) {

        alert(
            "لا توجد طرود متبقية."
        );

        return;
    }


    const first =
        candidates
            .find(
                p =>
                    p.lat &&
                    p.lon
            );


    if (!first) {

        document.getElementById(
            "nextStop"
        ).style.display =
            "block";


        document.getElementById(
            "nextStop"
        ).innerHTML =
            "ℹ️ لتحسين المسار بدقة نحتاج إحداثيات الطرود. يمكن استخدام عنوان Google Maps لكل طرد.";

        return;
    }


    const distance =
        calculateDistance(
            lastLat,
            lastLon,
            first.lat,
            first.lon
        );


    document.getElementById(
        "nextStop"
    ).style.display =
        "block";


    document.getElementById(
        "nextStop"
    ).innerHTML = `

        <b>
            📍 أقرب طرد:
        </b>

        ${escapeHTML(
            first.name ||
            "بدون اسم"
        )}

        <br>

        ${escapeHTML(
            getAddress(first)
        )}

        <br>

        المسافة:
        ${distance.toFixed(2)}
        كم

    `;
}

/* =====================================================
   ROUTE / GEOCODING
   ===================================================== */

function getParcelAddress(parcel) {
    const parts = [
        parcel.street || "",
        parcel.houseNumber || parcel.house || "",
        parcel.postalCode || parcel.zip || "",
        parcel.city || "",
        parcel.country || "Germany"
    ]
        .map(v => String(v || "").trim())
        .filter(Boolean);

    if (!parts.length && parcel.address) {
        return String(parcel.address).trim();
    }

    return [...new Set(parts)].join(", ");
}

async function geocodeParcel(parcel) {
    const address = getParcelAddress(parcel);

    if (!address || address.length < 4) return false;

    if (
        Number.isFinite(Number(parcel.lat)) &&
        Number.isFinite(Number(parcel.lon))
    ) {
        return true;
    }

    let cache = {};
    try {
        cache = JSON.parse(
            localStorage.getItem("pro_delivery_geocode_cache_v1") || "{}"
        ) || {};
    } catch (e) {}

    const cacheKey = address
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

    const cached = cache[cacheKey];

    if (
        cached &&
        Number.isFinite(Number(cached.lat)) &&
        Number.isFinite(Number(cached.lon))
    ) {
        parcel.lat = Number(cached.lat);
        parcel.lon = Number(cached.lon);
        parcel.geocodeProvider =
            cached.provider || "Nominatim / OpenStreetMap";
        return true;
    }

    const response = await fetch(
        GEOCODE_BACKEND_URL +
        "?q=" + encodeURIComponent(address) +
        "&lat=" + encodeURIComponent(lastLat ?? "") +
        "&lon=" + encodeURIComponent(lastLon ?? "")
    );

    if (!response.ok) return false;

    const data = await response.json();

    if (
        !data.success ||
        !Number.isFinite(Number(data.lat)) ||
        !Number.isFinite(Number(data.lon))
    ) {
        return false;
    }

    parcel.lat = Number(data.lat);
    parcel.lon = Number(data.lon);
    parcel.geocodeProvider =
        data.provider || "Nominatim / OpenStreetMap";

    cache[cacheKey] = {
        lat: parcel.lat,
        lon: parcel.lon,
        provider: parcel.geocodeProvider,
        savedAt: new Date().toISOString()
    };

    localStorage.setItem(
        "pro_delivery_geocode_cache_v1",
        JSON.stringify(cache)
    );

    return true;
}

function haversineDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const toRad = value =>
        Number(value) * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

    return 2 * R * Math.asin(Math.sqrt(a));
}

function getCurrentPositionForRoute() {
    return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
            reject(new Error(
                "هذا الجهاز لا يدعم تحديد الموقع."
            ));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position => {

                lastLat = position.coords.latitude;
                lastLon = position.coords.longitude;

                localStorage.setItem(
                    "last_lat",
                    String(lastLat)
                );

                localStorage.setItem(
                    "last_lon",
                    String(lastLon)
                );

                resolve(position);
            },
            error => {

                if (error.code === 1) {
                    reject(new Error(
                        "صلاحية الموقع مرفوضة. اسمح للموقع باستخدام GPS من إعدادات المتصفح."
                    ));
                } else {
                    reject(new Error(
                        "تعذر الحصول على موقعك الحالي."
                    ));
                }
            },
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 30000
            }
        );
    });
}

async function prepareParcelCoordinates() {

    const active = parcels.filter(
        p =>
            p.status !== "delivered" &&
            p.status !== "cancelled"
    );

    if (!active.length) {
        throw new Error(
            "لا توجد طرود نشطة."
        );
    }

    const loading =
        document.getElementById("loading");

    let completed = 0;

    if (loading) {
        loading.style.display = "block";
        loading.textContent =
            `📍 تحديد مواقع الطرود: 0 / ${active.length}`;
    }

    for (const parcel of active) {

        try {
            await geocodeParcel(parcel);
        } catch (error) {
            console.warn(
                "Geocoding failed:",
                error
            );
        }

        completed++;

        if (loading) {
            loading.textContent =
                `📍 تحديد مواقع الطرود: ${completed} / ${active.length}`;
        }

        // Nominatim public service: one request at a time.
        if (completed < active.length) {
            await new Promise(
                resolve => setTimeout(resolve, 1100)
            );
        }
    }

    if (typeof saveParcels === "function") {
        saveParcels();
    } else {
        localStorage.setItem(
            "saved_parcels",
            JSON.stringify(parcels)
        );
    }

    if (loading) {
        loading.textContent =
            "✅ تم تحديد مواقع الطرود.";
    }

    return active;
}

async function optimizeDeliveryRoute() {

    try {

        await getCurrentPositionForRoute();

        const active =
            await prepareParcelCoordinates();

        const located =
            active.filter(
                p =>
                    Number.isFinite(Number(p.lat)) &&
                    Number.isFinite(Number(p.lon))
            );

        if (!located.length) {
            throw new Error(
                "لم يتم العثور على إحداثيات صالحة للطرود. تحقق من العناوين."
            );
        }

        const remaining =
            located.map(parcel => ({
                parcel
            }));

        const route = [];

        let currentLat =
            Number(lastLat);

        let currentLon =
            Number(lastLon);

        while (remaining.length) {

            let bestIndex = 0;
            let bestDistance = Infinity;

            for (
                let i = 0;
                i < remaining.length;
                i++
            ) {

                const p =
                    remaining[i].parcel;

                const distance =
                    haversineDistanceKm(
                        currentLat,
                        currentLon,
                        Number(p.lat),
                        Number(p.lon)
                    );

                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestIndex = i;
                }
            }

            const selected =
                remaining.splice(
                    bestIndex,
                    1
                )[0].parcel;

            selected.routeDistanceKm =
                Number(bestDistance.toFixed(2));

            selected.routeOrder =
                route.length + 1;

            route.push(selected);

            currentLat =
                Number(selected.lat);

            currentLon =
                Number(selected.lon);
        }

        const inactive =
            parcels.filter(
                p =>
                    p.status === "delivered" ||
                    p.status === "cancelled"
            );

        parcels =
            [...route, ...inactive];

        if (typeof saveParcels === "function") {
            saveParcels();
        } else {
            localStorage.setItem(
                "saved_parcels",
                JSON.stringify(parcels)
            );
        }

        if (typeof updateUI === "function") {
            updateUI();
        }

        renderRoutePanel(route);

        return route;

    } catch (error) {

        console.error(
            "Route optimization error:",
            error
        );

        alert(
            error.message ||
            "تعذر ترتيب مسار التسليم."
        );

        return [];
    }
}

function renderRoutePanel(route) {

    let panel =
        document.getElementById("routeResult");

    if (!panel) {

        panel =
            document.createElement("div");

        panel.id =
            "routeResult";

        panel.className =
            "card";

        const firstCard =
            document.querySelector(".card");

        if (firstCard) {
            firstCard.parentNode.insertBefore(
                panel,
                firstCard.nextSibling
            );
        } else {
            document.body.prepend(panel);
        }
    }

    if (!route.length) {
        panel.innerHTML =
            "<strong>لا توجد طرود قابلة للترتيب.</strong>";
        return;
    }

    const next =
        route.find(
            p =>
                p.status !== "delivered" &&
                p.status !== "cancelled"
        );

    let html =
        "<h3 style='color:#38bdf8;margin-top:0'>🚚 ترتيب التسليم</h3>";

    if (next) {

        html += `
            <div style="
                background:#172554;
                border:1px solid #2563eb;
                padding:10px;
                border-radius:8px;
                margin-bottom:10px;
            ">
                <strong>🟢 الطرد التالي</strong><br>
                ${escapeRouteText(getParcelAddress(next))}<br>
                📍 ${Number(next.routeDistanceKm || 0).toFixed(2)} km
                <br>
                🔢 رقم ${next.routeOrder}
            </div>
        `;
    }

    html += route.map(
        (p, index) => `
            <div style="
                padding:8px;
                border-bottom:1px solid #334155;
            ">
                <strong>
                    ${index + 1}.
                    ${escapeRouteText(getParcelAddress(p))}
                </strong>
                <br>
                📏 ${Number(
                    p.routeDistanceKm || 0
                ).toFixed(2)} km
            </div>
        `
    ).join("");

    panel.innerHTML = html;
}

function escapeRouteText(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

window.optimizeDeliveryRoute =
    optimizeDeliveryRoute;

</script>
